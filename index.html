:root{

  --ok:#4fd18a;--ok-soft:#14301f;--warn:#f2b45a;--warn-soft:#33270f;--bad:#ff8a80;--bad-soft:#3a1715;color-scheme:dark}}
:root[data-theme="dark"]{

/* ---------------- PIN hashing (demo mode; live mode hashes in the database) ---------------- */
async function hashPin(pin){
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('cz-pos:' + pin));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
  } catch { let h = 0; for (const c of 'cz-pos:' + pin) h = (h*31 + c.charCodeAt(0)) | 0; return 'x' + h; }
}

  async checkout(emp, store, inv){

    let credit = [];

      if (cs.length !== inv.creditIds.length) throw new Error("That diagnostic was already credited, or isn't paid yet. Reload the ticket.");

    const devCost = lines.filter(l => l.deviceId).reduce((a, l) => { const dv = d.devices.find(x => x.id === l.deviceId); return a + (+dv?.cost || 0) + (+dv?.partsCost || 0); }, 0);
    const row = {id: uid(), number: d.nextInvoice++, at: now(), by: emp.id, store, ...inv, lines, subtotal, tax, total, payments, payment: tcSum > 0 ? (rest > 0 ? 'Trade-in credit + ' + pay : 'Trade-in credit') : pay};
    delete row.chargeIds; delete row.resolve; delete row.creditIds; delete row.credits; delete row.cashBack; if (!resolve) row.partsCost = 0; row.partsCost = (row.partsCost || 0) + devCost;
    let cashBack = 0;

      if (inv.cashBack && bb.creditLeft > 0) { cashBack += bb.creditLeft; bb.creditCash = (bb.creditCash || 0) + bb.creditLeft; bb.creditCashAt = now(); bb.creditLeft = 0; } });
    lines.filter(l => l.deviceId).forEach(l => { const dv = d.devices.find(x => x.id === l.deviceId); Object.assign(dv, {status: 'sold', soldPrice: l.price, soldAt: now(), updatedAt: now(), channel: /^acima/i.test(pay) ? 'In store · Acima' : 'In store'});

    row.cashBack = Math.round(cashBack * 100) / 100;
    if (credit.length) { const t0 = d.tickets.find(x => x.id === inv.ticketId); t0.charges.forEach(x => { if (inv.creditIds.includes(x.id)) x.creditedOn = row.number; }); }

    else if (inv.ticketId) { const t = d.tickets.find(x => x.id === inv.ticketId); t.updatedAt = now();

    this.log(d, emp.id, store, 'Invoice', `#${row.number} ${cents(row.total)} · ${inv.payment}`); this.save(d); return row;
  },

    po.status = po.lines.every(x => x.received >= x.qty) ? 'received' : 'partial';

  /* Big tables (90k+ RepairShopr tickets): load what the screens need (open + recent), and pull anything else on demand into a cache. */
  cC: new Map(), cT: new Map(), cI: new Map(),
  async all(q, max = 20000){ const out = []; for (let i = 0; i < max; i += 1000){ const {data, error} = await q().range(i, i + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out; },
  keep(map, rows){ (rows || []).forEach(r => map.set(r.id, r)); return rows || []; },
  async customers(){
    await (this._tp || this.tickets()).catch(() => {});
    const since = new Date(Date.now() - 45*86400000).toISOString();
    const recent = await this.all(() => this.sb.from('customers_v').select('*').gte('createdAt', since).order('createdAt', {ascending: false}), 3000);
    this.keep(this.cC, recent);
    const need = [...new Set([...this.cT.values()].map(t => t.customerId).filter(id => id && !this.cC.has(id)))];
    for (let i = 0; i < need.length; i += 150){ const {data} = await this.sb.from('customers_v').select('*').in('id', need.slice(i, i + 150)); this.keep(this.cC, data); }
    return [...this.cC.values()];

  async search(q){ q = (q || '').trim(); if (q.length < 2) return; const d = q.replace(/\D/g, ''); const like = '%' + q.replace(/[%,()]/g, ' ') + '%';
    const [cs, ts] = await Promise.all([
      this.sb.from('customers_v').select('*').or(d.length >= 4 ? `phone.ilike.%${d}%,name.ilike.${like}` : `name.ilike.${like},email.ilike.${like},business.ilike.${like}`).limit(40),
      /^\d{3,7}$/.test(q) ? this.sb.from('tickets_v').select('*').eq('number', +q).limit(5) : this.sb.from('tickets_v').select('*').ilike('subject', like).order('number', {ascending: false}).limit(30)]);
    this.keep(this.cC, cs.data); this.keep(this.cT, ts.data);
    const need = (ts.data || []).map(t => t.customerId).filter(id => id && !this.cC.has(id)); if (need.length) { const {data} = await this.sb.from('customers_v').select('*').in('id', need); this.keep(this.cC, data); }
    if (cs.data?.length) { const {data} = await this.sb.from('tickets_v').select('*').in('customerId', cs.data.slice(0, 15).map(c => c.id)).order('number', {ascending: false}).limit(60); this.keep(this.cT, data); }
  },

function sheet(html, onMount){
  const L = $('#layer');
  L.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="panel stack">${html}</div></div>`;
  const close = () => { L.innerHTML = ''; };
  L.querySelector('.sheet').addEventListener('click', e => { if (e.target.classList.contains('sheet')) close(); });
  L.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  onMount && onMount(L, close);
  return close;
}

/* ask any employee (or a manager) for a PIN inside the page */
function askPin(title, needRank = 0){
  return new Promise(resolve => {
    let pin = '';
    const close = sheet(`
      <div class="row" style="justify-content:space-between"><h3>${esc(title)}</h3><button data-close aria-label="Cancel">Cancel</button></div>
      <div class="pinshow" id="ps">${'<i></i>'.repeat(4)}</div>
      <div class="err" id="pe" role="alert"></div>
      <div class="pad" id="pp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('')}</div>`,
      (L, close) => {
        const draw = () => L.querySelectorAll('#ps i').forEach((i, n) => i.classList.toggle('on', n < pin.length));
        L.querySelector('#pp').onclick = async e => {
          const k = e.target.dataset.k; if (k == null) return;
          L.querySelector('#pe').textContent = '';
          if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
          draw();
          if (pin.length === 4) {
            const emp = await Store.verifyPin(pin);
            if (!emp || RANK[emp.role] < needRank) {
              L.querySelector('#pe').textContent = !emp ? 'That PIN didn\'t match anyone. Try again.' : `${emp.name} can't approve this. A manager PIN is needed.`;
              pin = ''; draw(); return;
            }
            close(); resolve(emp);
          }
        };
        L.querySelector('[data-close]').addEventListener('click', () => resolve(null));
      });
  });
}

const helpWords = s => String(s || '').toLowerCase().replace(/[^a-z0-9$ ]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !['the','a','an','to','do','how','i','we','my','is','it','on','in','of','for','and','or','can','what','where','with','when','you','does','customer','wants','want','someone','their','his','her','need','needs','they','he','she','this','that'].includes(w));
function helpMatch(q, n = 3){
  const ws = [...new Set(helpWords(q))]; if (!ws.length) return [];
  const docs = HELP_KB.map(h => ' ' + helpWords(h.t + ' ' + h.k).join(' ') + ' ');
  const hit = (d, w) => d.includes(' ' + w + ' ') || (w.length > 3 && (d.includes(' ' + w.replace(/(ing|ed|es|s)$/, '')) || d.includes(' ' + w.slice(0, -1))));
  const idf = w => Math.log(1 + HELP_KB.length / (1 + docs.filter(d => hit(d, w)).length));
  return HELP_KB.map((h, i) => ({h, sc: ws.reduce((a, w) => a + (hit(docs[i], w) ? idf(w) * (hit(' ' + helpWords(h.t).join(' ') + ' ', w) ? 1.5 : 1) : 0), 0)}))
    .filter(x => x.sc > 0.4).sort((a, b) => b.sc - a.sc).slice(0, n).map(x => x.h);
}
const helpKbText = () => HELP_KB.map(h => `## ${h.t}\n${h.s.map((x, i) => `${i + 1}. ${x}`).join('\n')}`).join('\n\n');
function helpRender(text){
  const lines = String(text || '').trim().split('\n'); let out = '', inList = false;
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  lines.forEach(l => { const m = l.match(/^\s*(\d+)[.)]\s+(.*)/);
    if (m) { if (!inList) { out += '<ol>'; inList = true; } out += `<li>${fmt(m[2])}</li>`; }
    else { if (inList) { out += '</ol>'; inList = false; } if (l.trim()) out += `<p>${fmt(l.replace(/^\s*[-•]\s+/, '• '))}</p>`; } });
  return out + (inList ? '</ol>' : '');
}

/* ---------------- TICKET CHARGES → INVOICE ----------------
   Charges build up on the ticket (diagnostic, the repair, glass, a case...). "Take payment" turns the ones you tick into one invoice.
   Paying only the diagnostic keeps the ticket open; paying everything at pickup closes it. */
/* ---------------- TRADE-IN CREDIT ----------------
   A buy paid as "Trade-in credit" leaves that amount on the seller. At checkout the credit comes off the total; the rest is paid
   the normal way. If the credit is bigger than the sale, the rest goes back to them in cash (from the buyback fund) or stays as credit. */
const tradeCalc = (credits, total, st) => { const avail = Math.round(credits.reduce((a, c) => a + (+c.creditLeft || 0), 0) * 100) / 100;
  const applied = st.use ? Math.min(avail, Math.round(total * 100) / 100) : 0; const due = Math.round((total - applied) * 100) / 100; const left = st.use ? Math.round((avail - applied) * 100) / 100 : 0;
  let rem = applied; const alloc = credits.map(c => { const a = Math.min(+c.creditLeft || 0, rem); rem = Math.round((rem - a) * 100) / 100; return {buybackId: c.buybackId, amount: Math.round(a * 100) / 100}; }).filter(x => x.amount > 0);
  return {avail, applied, due, left, alloc}; };
function tradeBox(credits, total, st){
  if (!credits?.length) return '';
  const k = tradeCalc(credits, total, st);
  return `<div class="stack" style="gap:6px;background:var(--ok-soft);border-radius:var(--r);padding:10px 12px">
    <label class="row" style="gap:10px;cursor:pointer;align-items:flex-start"><input type="checkbox" data-tr="use" ${st.use ? 'checked' : ''} style="width:20px;height:20px;margin-top:2px">
      <span><b>Use trade-in credit: ${cents(k.avail)}</b><span class="small muted" style="display:block">${credits.map(c => `${esc([c.model, c.storage].filter(Boolean).join(' ') || 'Device')} bought ${fmtDate(c.at)}${c.paid !== c.creditLeft ? ` (${cents(c.creditLeft)} left of ${cents(c.paid)})` : ''}`).join(' · ')}</span></span></label>
    ${st.use ? `<div class="row" style="justify-content:space-between"><span>Trade-in credit</span><b class="num">−${cents(k.applied)}</b></div>
      <div class="row" style="justify-content:space-between"><span>Balance to pay</span><b class="num" style="font-size:18px">${cents(k.due)}</b></div>
      ${k.left > 0 ? `<div class="stack small" style="gap:4px;border-top:1px solid var(--line);padding-top:6px"><b>${cents(k.left)} of credit is left over.</b>
        <label class="row" style="gap:8px;cursor:pointer"><input type="radio" name="tr-left" data-tr="cash" ${st.cashBack ? 'checked' : ''}> Give ${cents(k.left)} back in cash now (from the buyback fund)</label>
        <label class="row" style="gap:8px;cursor:pointer"><input type="radio" name="tr-left" data-tr="keep" ${st.cashBack ? '' : 'checked'}> Keep it as trade-in credit for their next visit</label></div>` : ''}` : ''}
  </div>`;
}

  root.querySelectorAll('[data-tr]').forEach(i => i.onchange = () => { const k = i.dataset.tr; if (k === 'use') st.use = i.checked; else st.cashBack = k === 'cash'; redraw(); });

/* ---------- parts that fit a repair ----------
   "iPhone 11 Pro Max" matches "iPhone 11 Pro Max Oled" and "iPhone 11 Pro Max AQ7", not "iPhone 11 Pro Oled".
   want: 'lcd' (aftermarket / incell / AQ7), 'oled' (XO7 / OLED / genuine) or null. Glass repairs use no part. */
const partNorm = x => ' ' + String(x || '').toLowerCase().replace(/\b(apple|iphone|samsung|galaxy|google)\b/g, ' ').replace(/\(.*?\)/g, ' ').replace(/\bplus\b/g, '+').replace(/\s*\+/g, '+').replace(/\s+/g, ' ').trim() + ' ';
const partKey = device => partNorm(String(device || '').replace(/\b\d+\s?(gb|tb)\b/ig, '').replace(/\b(unlocked|t-mobile|verizon|at&t|black|white|blue|red|green|gray|grey|gold|silver|purple|pink)\b/ig, '')).trim();
const partQual = n => /oled|xo7|x07|genuine|oem|service pack/i.test(n) ? 'oled' : /aq7|incell|lcd|aftermarket/i.test(n) ? 'lcd' : null;
const PART_TYPES = {battery: /batter/i, port: /charg|port/i, back: /back glass|back housing|housing|frame/i, camera: /camera|lens/i, speaker: /speaker|mesh/i};
const repairType = name => /lcd|oled|display|digitizer|glass \+ lcd/i.test(name) && !/back glass/i.test(name) ? 'display' : Object.keys(PART_TYPES).find(k => PART_TYPES[k].test(name)) || null;
const partIsType = (p, type) => !type ? true : type === 'display' ? (p.kind === 'Screen' || /lcd|oled|xo7|x07|aq7|incell|digitizer|display/i.test(p.name)) && !/batter|charg|port|camera|back|speaker/i.test(p.name) : PART_TYPES[type].test(p.name);
function partsFor(parts, device, want, store, type){
  const key = partKey(device); if (!key) return []; parts = parts.filter(p => partIsType(p, type));
  const esc2 = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const strict = new RegExp('[\\s/]' + esc2 + '(?=[\\s/])(?!\\s*(max|mini|ultra|pro|\\+|fe|e|lite)\\b)(?!\\+)');
  let hits = parts.filter(p => strict.test(partNorm(p.name)));
  if (!hits.length) { const w = key.split(' '); hits = parts.filter(p => { const n = partNorm(p.name); return w.every(x => n.includes(' ' + x)); }); }
  const score = p => (want && partQual(p.name) === want ? 2 : 0) + ((p.qty?.[store] || 0) > 0 ? 1 : 0);
  return hits.sort((a, b) => score(b) - score(a) || a.name.localeCompare(b.name)).slice(0, 8);
}
const repairWants = name => /^glass repair/i.test(name) ? 'none' : /lcd replacement \(aftermarket\)|^lcd/i.test(name) ? 'lcd' : /oled/i.test(name) ? 'oled' : /lcd/i.test(name) ? 'lcd' : null;

/* ---------- passcode / Samsung pattern ----------
   A pattern is saved in the passcode field as "Pattern 1-2-3-6-9": dots numbered 1-9, left to right, top to bottom. */
const isPattern = v => /^Pattern [1-9](-[1-9])*$/.test(v || '');
const patSeq = v => isPattern(v) ? v.slice(8).split('-').map(Number) : [];
function patSVG(seq, size = 150, live = false){
  const g = size / 3, xy = n => [((n - 1) % 3) * g + g / 2, Math.floor((n - 1) / 3) * g + g / 2], r = size / 13;
  const lines = seq.slice(1).map((n, i) => { const [a, b] = xy(seq[i]), [c, d] = xy(n); return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#2563eb" stroke-width="${size / 30}" stroke-linecap="round"/>`; }).join('');
  const dots = [1,2,3,4,5,6,7,8,9].map(n => { const [x, y] = xy(n), k = seq.indexOf(n);
    return `<g ${live ? `data-dot="${n}" style="cursor:pointer"` : ''}>${live ? `<circle cx="${x}" cy="${y}" r="${g / 2.2}" fill="transparent"/>` : ''}<circle cx="${x}" cy="${y}" r="${r}" fill="${k === 0 ? '#16a34a' : k > 0 ? '#2563eb' : '#cbd5e1'}"/>${k >= 0 ? `<text x="${x}" y="${y + r * .38}" text-anchor="middle" font-size="${r * 1.1}" font-weight="700" fill="#fff" font-family="Arial">${k + 1}</text>` : ''}</g>`; }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${seq.length ? 'Pattern ' + seq.join('-') : 'Empty pattern'}">${lines}${dots}</svg>`;
}
/* passcode entry: Passcode / Pattern (Samsung) / None. state = {mode, code, seq}; onChange(valueToSave) */
function pcField(id, value, onChange){
  const st = {mode: isPattern(value) ? 'pattern' : value === 'None' ? 'none' : 'code', code: isPattern(value) || value === 'None' ? '' : (value || ''), seq: patSeq(value)};
  const val = () => st.mode === 'pattern' ? (st.seq.length ? 'Pattern ' + st.seq.join('-') : '') : st.mode === 'none' ? 'None' : st.code.trim();
  const html = () => `<div class="row" style="gap:6px">${[['code', 'Passcode / PIN'], ['pattern', 'Pattern (Samsung)'], ['none', 'No passcode']].map(([k, l]) => `<button type="button" data-pcm="${k}" class="${st.mode === k ? 'primary' : ''}" style="min-height:36px;padding:4px 12px">${l}</button>`).join('')}</div>
    ${st.mode === 'code' ? `<input id="${id}-in" value="${esc(st.code)}" autocomplete="off" placeholder="So the tech can test it after the repair" aria-label="Passcode">`
    : st.mode === 'pattern' ? `<div class="row" style="gap:14px;align-items:center"><div id="${id}-pad" style="background:var(--soft);border-radius:12px;padding:6px;touch-action:none">${patSVG(st.seq, 168, true)}</div>
        <div class="stack" style="gap:6px"><span class="small">${st.seq.length ? `<b>${st.seq.join(' → ')}</b>` : 'Tap the dots in the order the customer draws it. Green is the start.'}</span><button type="button" id="${id}-clr" style="min-height:34px;padding:4px 12px">Clear</button></div></div>`
    : '<span class="small muted">The customer has no lock on the device.</span>'}`;
  const mount = box => { box.innerHTML = html();
    box.querySelectorAll('[data-pcm]').forEach(b => b.onclick = () => { st.mode = b.dataset.pcm; onChange(val()); mount(box); });
    const inp = box.querySelector(`#${id}-in`); if (inp) inp.oninput = () => { st.code = inp.value; onChange(val()); };

    S.cart = []; S.cartPhone = ''; S.prods = null; S.rgDevs = null; S.rgTrade = null; viewRegister(el);

/* ---------------- CLOSE OUT (end of day) + PAYOUT REQUESTS ---------------- */
S.coDay = null;
async function viewCloseout(el){

  const [invs, bbsAll, closes, set, regs] = await Promise.all([Store.invoices(t0, t1), Store.buybacksAll().catch(() => []), Store.closeouts(), Store.settings(), Store.registerDays()]);
  const inv = invs.filter(i => i.store === S.store);
  const bbs = bbsAll.filter(b => b.store === S.store && new Date(b.at) >= t0 && new Date(b.at) < t1);
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const parts = inv.flatMap(payParts);
  const by = [...PAYMENTS, 'Trade-in credit'].map(p => [p, sum(parts.filter(x => x.method === p), x => x.amount)]);
  const out = PAYOUTS.map(p => [p, sum(bbs.filter(b => b.payout === p), b => b.paid)]);
  const tradeCash = sum(bbsAll.filter(b => b.store === S.store && b.creditCashAt && new Date(b.creditCashAt) >= t0 && new Date(b.creditCashAt) < t1), b => b.creditCash || 0);
  if (tradeCash) out.push(['Trade-in credit given back in cash', tradeCash]);
  const cashIn = by.find(x => x[0] === 'Cash')[1], cashOut = out.find(x => x[0] === 'Cash')[1] + tradeCash;
  const done = closes.find(c => c.store === S.store && c.day === day);

  el.innerHTML = `<div class="stack">
    ${pending.length ? `<div class="panel stack"><h2>Payout requests</h2><p class="muted small" style="margin:0">Sellers paid by Apple Pay, Cash App, Zelle or PayPal. Each one went to Sam as an alert${Store.mode === 'live' ? ' and a Slack message' : ''} with its buyback ID.</p>
      <div class="tbl"><table><thead><tr><th>Buyback ID</th><th>Seller</th><th>Send to</th><th class="r">Amount</th><th>Requested</th><th></th></tr></thead><tbody>
      ${pending.map(b => `<tr><td class="num"><b>${esc(b.bbId)}</b></td><td>${esc(b.seller.firstName)} ${esc(b.seller.lastName)}<div class="small muted num">${fmtPhone(b.seller.phone)}</div></td><td>${esc(b.payout)}: <b>${esc(b.payoutTo || '—')}</b></td><td class="r num">${cents(b.paid)}</td><td class="small">${ago(b.at)} · ${STORES[b.store]}</td>
        <td class="r">${can(3) ? `<button class="primary" data-paid="${b.id}" style="min-height:34px;padding:4px 10px">Mark sent</button>` : '<span class="pill warn">Waiting on Sam</span>'}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    <div id="co-reg"></div>
    <div class="panel stack"><h3>Register history · ${can(3) ? 'all stores' : STORES[S.store]}</h3><div class="tbl"><table><thead><tr><th>Day</th><th>Store</th><th class="r">Drawer start</th><th class="r">Cash sales</th><th class="r">Drawer count</th><th class="r">Deposit</th><th class="r">Fund start</th><th class="r">Cash buys</th><th class="r">Fund count</th><th>Over / short</th><th>Closed by</th></tr></thead><tbody>
      ${regs.filter(r => can(3) || r.store === S.store).map(r => { const o = (a, b) => a == null ? '' : Math.abs(a - b) < 0.005 ? 'exact' : (a > b ? '+' : '−') + cents(Math.abs(a - b)); const bad = r.closedAt && (Math.abs(r.drawerCounted - r.drawerExpected) >= 5 || Math.abs(r.fundCounted - r.fundExpected) >= 5);
        return `<tr><td>${r.day}</td><td>${r.store}</td><td class="r num">${cents(r.openDrawer)}</td><td class="r num">${r.closedAt ? cents(r.cashSales) : '—'}</td><td class="r num">${r.closedAt ? cents(r.drawerCounted) : '<span class="pill warn">open</span>'}</td><td class="r num">${r.closedAt ? cents(r.deposit) : ''}</td>
        <td class="r num">${cents(r.openFund)}</td><td class="r num">${r.closedAt ? cents(r.cashBuys) : ''}</td><td class="r num">${r.closedAt ? cents(r.fundCounted) : ''}</td>
        <td class="small" style="color:${bad ? 'var(--bad)' : 'inherit'}">${r.closedAt ? `drawer ${o(r.drawerCounted, r.drawerExpected)} · fund ${o(r.fundCounted, r.fundExpected)}${r.notes ? `<div class="muted">${esc(r.notes)}</div>` : ''}` : ''}</td><td class="small">${r.closedBy ? esc(staffName(r.closedBy)) : ''}</td></tr>`; }).join('') || '<tr><td colspan="11" class="muted">No register days yet.</td></tr>'}
    </tbody></table></div></div></div>`;
  registerPanel($('#co-reg'), () => viewCloseout(el));
  el.querySelectorAll('[data-paid]').forEach(b => b.onclick = () => sheet(`<div class="row" style="justify-content:space-between"><h3>Mark payout sent</h3><button data-close>Close</button></div>
    <div class="field"><label class="label" for="pd-ref">Confirmation (optional)</label><input id="pd-ref" placeholder="Apple Pay 11/10 2:14 PM"></div><button class="primary" id="pd-go">Mark sent</button>`,
    (L, close) => L.querySelector('#pd-go').onclick = async () => { try { await Store.markPayout(S.user, b.dataset.paid, L.querySelector('#pd-ref').value.trim()); close(); toast('Payout marked sent. The store sees it.'); viewCloseout(el); } catch (e) { toast(e.message); } }));
}

/* ---------------- COUNTS: phones every day, parts Mon/Wed/Fri ---------------- */
S.cnt = null;

        ${onHand.map(d => `<tr class="click" data-cd="${d.id}"><td style="width:40px">${seen.has(d.id) ? '<span class="pill ok">✓</span>' : '<span class="pill">—</span>'}</td><td class="num">${d.stockNo}</td><td>${esc(d.model)} ${esc(d.storage)} <span class="muted">${esc(d.carrier)}</span></td><td class="small">${STATUS_LABEL[d.status]}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="err" id="ct-err" role="alert"></div>
        <button class="primary" id="ct-save" style="min-height:52px">Finish count (${onHand.length - seen.size} missing)</button></div></div>`;

    const add = () => { const v = $('#ct-scan').value.trim(); if (!v) return; const d = onHand.find(x => String(x.stockNo) === v);

    $('#ct-add').onclick = add; $('#ct-scan').onkeydown = e => { if (e.key === 'Enter') add(); }; $('#ct-scan').focus();
    el.querySelectorAll('[data-cd]').forEach(tr => tr.onclick = () => { seen.has(tr.dataset.cd) ? seen.delete(tr.dataset.cd) : seen.add(tr.dataset.cd); viewCounts(el); });
    $('#ct-save').onclick = async () => {
      const missing = onHand.filter(d => !seen.has(d.id)).map(d => `#${d.stockNo} ${d.model} ${d.storage}`);
      await Store.saveCount(S.user, S.store, {kind: 'phones', expected: onHand.length, found: seen.size, missing, extra: [...extra]});
      S.cnt = null; toast(missing.length || extra.length ? `Saved. ${missing.length} missing, ${extra.length} unexpected. A manager has been alerted.` : 'Saved. Every phone accounted for.'); viewCounts(el); };
    return;
  }
  if (S.cnt?.kind === 'parts') {
    const C = S.cnt.counted;
    el.innerHTML = `<div class="stack"><div class="crumb"><a id="back">Counts</a><span class="muted">›</span><b>Parts count · ${STORES[S.store]}</b></div>

        ${parts.map(p => { const exp = p.qty[S.store] || 0, c = C[p.id]; const diff = c === undefined || c === '' ? null : +c - exp; return `<tr><td>${esc(p.name)}</td><td class="r num">${exp}</td>
          <td class="r"><input data-pc="${p.id}" inputmode="numeric" value="${c ?? ''}" style="width:80px;min-height:36px;text-align:right" aria-label="Counted ${esc(p.name)}"></td>
          <td class="r num" style="color:${diff ? 'var(--bad)' : 'inherit'}">${diff == null ? '' : diff > 0 ? '+' + diff : diff}</td></tr>`; }).join('')}
        </tbody></table></div>
        ${can(2) ? '<label class="row small" style="gap:8px"><input type="checkbox" id="pc-apply" style="width:auto;min-height:auto"> Set the system counts to what we counted (manager)</label>' : ''}
        <button class="primary" id="pc-save" style="min-height:52px">Finish count</button></div></div>`;
    $('#back').onclick = () => { S.cnt = null; viewCounts(el); };

    $('#pc-save').onclick = async () => {
      const items = parts.filter(p => C[p.id] !== undefined && C[p.id] !== '').map(p => ({id: p.id, name: p.name, expected: p.qty[S.store] || 0, counted: +C[p.id]}));

        <div class="stat"><span class="label">Should be in ${STORES[S.store]}</span><span class="v">${onHand.length}</span><span class="small muted">${onHand.filter(d => d.status === 'repair').length} in repair stock${inTransit.length ? ` · ${inTransit.length} transfer${inTransit.length > 1 ? 's' : ''} in transit (not counted)` : ''}</span></div>
        ${phonesDone ? `<div class="banner ${phonesDone.missing.length || phonesDone.extra.length ? 'bad' : 'ok'} small">Counted today at ${fmtTime(phonesDone.at)} by ${esc(staffName(phonesDone.by))}: ${phonesDone.missing.length ? phonesDone.missing.length + ' missing' : 'all here'}${phonesDone.extra.length ? ', ' + phonesDone.extra.length + ' unexpected' : ''}.</div>` : '<div class="banner warn small">Not counted yet today.</div>'}
        <button class="primary" id="ct-ph">${phonesDone ? 'Count again' : 'Start phone count'}</button></div>
      <div class="panel stack"><h2>Parts · Mon, Wed, Fri</h2>
        <p class="muted small" style="margin:0">Every part used on a ticket or repair stock, every Sentrix delivery and transfer already moves the count. The shelf count catches anything that walked off.</p>
        <div class="stat"><span class="label">Parts tracked</span><span class="v">${parts.length}</span><span class="small muted">${partsCountDay() ? 'Count day' : 'Next count: ' + ['Mon','Mon','Wed','Wed','Fri','Fri','Mon'][new Date().getDay()]}</span></div>
        ${partsDone ? `<div class="banner ${partsDone.items.some(i => i.counted !== i.expected) ? 'bad' : 'ok'} small">Counted today: ${partsDone.items.filter(i => i.counted !== i.expected).length} off.</div>` : partsCountDay() ? '<div class="banner warn small">Count day. Not counted yet.</div>' : ''}
        <button id="ct-pt" class="${partsCountDay() && !partsDone ? 'primary' : ''}">Start parts count</button></div>

    ${counts.filter(c => can(3) || c.store === S.store).slice(0, 30).map(c => { const off = c.kind === 'phones' ? c.missing.length + c.extra.length : c.items.filter(i => i.counted !== i.expected).length;
      return `<tr><td class="small">${fmtDate(c.at)} ${fmtTime(c.at)}</td><td>${c.store}</td><td>${c.kind === 'phones' ? 'Phones' : 'Parts'}</td>
      <td class="small">${off ? `<span class="pill bad">${off} off</span> ${esc(c.kind === 'phones' ? [...c.missing, ...c.extra.map(x => 'unexpected #' + x)].join(', ') : c.items.filter(i => i.counted !== i.expected).map(i => `${i.name} ${i.expected}→${i.counted}`).join(', '))}` : '<span class="pill ok">Matched</span>'}</td><td class="small">${esc(staffName(c.by))}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No counts yet.</td></tr>'}
    </tbody></table></div></div></div>`;
  $('#ct-ph').onclick = () => { S.cnt = {kind: 'phones', seen: new Set(), extra: []}; viewCounts(el); };
  $('#ct-pt').onclick = () => { S.cnt = {kind: 'parts', counted: {}}; viewCounts(el); };
}

/* ---------------- DEVICE INVENTORY ---------------- */
function nextStatusHint(d){
  const age = daysOld(d.createdAt);
  if (d.status === 'testing' && age >= 3) return ['warn', `Testing ${age} days`];
  if (d.status === 'repair' && age >= 7) return ['bad', `Waiting on repair ${age} days`];
  if (d.status === 'tolist' && age >= 3) return ['warn', `Not listed after ${age} days`];
  if (d.status === 'swappa' && age >= 21) return ['warn', `Listed ${age} days`];
  return null;
}

/* ---------------- WHOLESALE (Atlas) ----------------
   Devices bought to be wholesaled sit here, per store, until they ship. "Ship to Atlas" takes the ticked ones out of wholesale
   (they become Sent to Atlas) and logs the box as a batch; the Atlas payout is recorded on the batch when it arrives. */
S.ws = {store: 'mine', tab: 'stock', pick: new Set()};
async function viewWholesale(el){
  const W = S.ws; if (!can(3)) W.store = 'mine';
  const [all, batches] = await Promise.all([Store.devices(), Store.atlasBatches().catch(() => [])]);

  [...W.pick].forEach(id => { if (!stock.some(d => d.id === id)) W.pick.delete(id); });
  const bs = batches.filter(b => inS(b.store));
  const cost = list => list.reduce((a, d) => a + (+d.cost || 0) + (+d.partsCost || 0), 0);
  const perStore = Object.keys(STORES).map(k => [k, all.filter(d => d.status === 'wholesale' && d.store === k)]);

  const picked = stock.filter(d => W.pick.has(d.id));
  el.innerHTML = `<div class="stack">

      ${can(3) ? `<select id="ws-store" aria-label="Store" style="width:auto"><option value="mine">${STORES[S.store]}</option><option value="all">All stores</option>${Object.entries(STORES).filter(([k]) => k !== S.store).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>` : ''}</div>
    ${can(3) ? `<div class="grid g3">${perStore.map(([k, l]) => `<div class="stat"><span class="label">${STORES[k]} wholesale</span><span class="v">${l.length}</span><span class="small muted">${money(cost(l))} cost</span></div>`).join('')}</div>` : ''}
    <div class="statusbar" role="group" aria-label="View"><button data-wt="stock" aria-pressed="${W.tab === 'stock'}">In wholesale (${stock.length})</button><button data-wt="log" aria-pressed="${W.tab === 'log'}">Shipped to Atlas (${bs.length})</button></div>
    ${W.tab === 'stock' ? `
    <div class="panel stack">
      <div class="row" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><span><b>${stock.length}</b> device${stock.length === 1 ? '' : 's'} · <b class="num">${money(cost(stock))}</b> cost${W.store === 'all' ? ' · pick one store to ship' : ''}</span>
        ${shipStore && stock.length ? `<span class="row" style="gap:6px"><button id="ws-all">${picked.length === stock.length ? 'Untick all' : 'Tick all'}</button><button class="primary" id="ws-ship" ${picked.length ? '' : 'disabled'}>Ship to Atlas · ${picked.length} device${picked.length === 1 ? '' : 's'}</button></span>` : ''}</div>
      <div class="tbl"><table><thead><tr>${shipStore ? '<th style="width:36px"></th>' : ''}<th>Stock #</th><th>Device</th><th>IMEI / serial</th><th>Condition</th><th class="r">Cost</th><th>In wholesale</th>${W.store === 'all' ? '<th>Store</th>' : ''}</tr></thead><tbody>
      ${stock.map(d => { const age = daysOld(d.wholesaleAt || d.updatedAt); return `<tr ${shipStore ? `data-wp="${d.id}" style="cursor:pointer"` : ''}>${shipStore ? `<td><input type="checkbox" ${W.pick.has(d.id) ? 'checked' : ''} aria-label="Ship #${d.stockNo}" style="width:20px;height:20px"></td>` : ''}
        <td class="num"><a data-dv="${d.id}" style="color:var(--accent);cursor:pointer">#${d.stockNo}</a></td><td>${esc(d.model)} ${esc(d.storage || '')}<div class="small muted">${esc(d.carrier || '')}${d.color ? ' · ' + esc(d.color) : ''}</div></td>

        <td><span class="${age >= 14 ? 'pill bad' : age >= 7 ? 'pill warn' : 'small'}">${age}d</span></td>${W.store === 'all' ? `<td>${d.store}</td>` : ''}</tr>`; }).join('') || `<tr><td colspan="8" class="muted">Nothing in wholesale${shipStore ? ' at ' + STORES[shipStore] : ''}. After a buy, tap "Wholesale" on the buy-complete screen, or move any device here from its page.</td></tr>`}
      </tbody></table></div>
    </div>` : `
    <div class="stack">${bs.map(b => { const margin = b.payout != null ? b.payout - b.costTotal : null; return `<div class="panel stack" style="gap:8px">

    </div>
    <div class="field"><label class="label" for="d-n">Notes</label><input id="d-n" value="${esc(d.notes || '')}"></div>

      L.querySelector('#d-lbl').onclick = () => labelSheet(d);
      L.querySelector('#d-bos2') && (L.querySelector('#d-bos2').onclick = () => bosSheet(d.buybackId, d.id));
      L.querySelector('#d-rep2') && (L.querySelector('#d-rep2').onclick = () => { close(); go('repair', {deviceId: d.id}); });
      const sync = () => { const s = L.querySelector('#d-s').value; L.querySelector('#d-list-f').hidden = s !== 'swappa'; L.querySelector('#d-sold-f').hidden = !['sold','atlas'].includes(s); };
      L.querySelector('#d-s').onchange = sync; sync();
      L.querySelector('#d-save').onclick = async () => {
        const status = L.querySelector('#d-s').value; const patch = {status, notes: L.querySelector('#d-n').value.trim()};
        const im = L.querySelector('#d-imei').value.trim(); if (im !== (d.imei || '')) patch.imei = im;
        const ci = L.querySelector('#d-cost'); if (ci && ci.value.trim() !== '') { const cv = parseFloat(ci.value.replace(/[$,]/g, '')); if (!(cv >= 0)) { L.querySelector('#d-err').textContent = 'Cost should be a number.'; return; } if (cv !== +d.cost) patch.cost = cv; }
        if (im && (patch.imei !== undefined || patch.cost !== undefined) && /IMEI \+ cost needed/.test(patch.notes) && (im && (patch.cost ?? +d.cost) > 0)) patch.notes = patch.notes.replace(/\s*·?\s*IMEI \+ cost needed/, '').trim();
        if (status === 'swappa' && d.status !== 'swappa') { const p = parseFloat(L.querySelector('#d-list').value); if (!(p > 0)) { L.querySelector('#d-err').textContent = 'Enter the Swappa list price.'; return; }
          await Store.swappaList(S.user, S.store, d.id, p); close(); toast('Listed on Swappa'); return after(); }
        if (status === 'sold' && L.querySelector('#d-ch').value === 'Swappa') { await Store.swappaSold(S.user, S.store, d.id, parseFloat(L.querySelector('#d-sold').value) || 0, ''); close(); toast(`${STORES[d.store]} alerted to pull and pack it`); return after(); }
        if (status === 'sold' || status === 'atlas') {
          const v = parseFloat(L.querySelector('#d-sold').value);
          if (status === 'sold' && !(v > 0)) { L.querySelector('#d-err').textContent = 'Enter what it sold for so profit is tracked.'; return; }
          if (v > 0) { patch.soldPrice = v; patch.channel = L.querySelector('#d-ch').value; if (status === 'atlas') patch.channel = 'Atlas'; }
        }
        await Store.updateDevice(S.user, S.store, d.id, patch);
        close(); toast('Saved'); after();
      };
    });
}

function suggestOrder(store, parts, reqs, pos){
  const onOrder = id => pos.filter(p => p.store === store && p.status !== 'received').reduce((a, p) => a + p.lines.filter(l => l.partId === id).reduce((x, l) => x + l.qty - l.received, 0), 0);
  const lines = parts.filter(p => p.dq > 0).map(p => ({name: p.name, partId: p.id, qty: Math.max(0, p.dq - (p.qty[store] || 0) - onOrder(p.id)), why: `DQ ${p.dq} · have ${p.qty[store] || 0}${onOrder(p.id) ? ' · on order ' + onOrder(p.id) : ''}`, requestIds: []})).filter(l => l.qty > 0);
  reqs.filter(r => r.store === store && r.status === 'needed' && !r.poId).forEach(r => {
    const same = r.partId && lines.find(l => l.partId === r.partId);
    if (same) { same.qty += r.qty; same.requestIds.push(r.id); same.why += ` · +${r.qty} for ${r.forLabel || 'request'}`; }
    else lines.push({name: r.name, partId: r.partId, qty: r.qty, why: (r.rush ? 'RUSH special order: ' : 'Special order: ') + (r.forLabel || 'shelf stock') + (r.cost ? ` · Sentrix ${cents(r.cost)}` : ''), requestIds: [r.id], productId: r.productId || '', url: r.url || '', quality: r.quality || ''});
  });
  return lines;
}

/* Repair prices: read the published tabs of REPAIR PRICES - CZ (same as the rep quote page). Falls back to the saved copy. */
const RQ_PUB = 'https://docs.google.com/spreadsheets/d/1_LCeGk23y5aZ_mT3Oej_6f1b9Zh9PhYuK8R5LlxaNkA/pub';
const RQ_TABS = {Apple: 510910333, Samsung: 1436859400, Pixel: 1436859500, Moto: 746224264, Consoles: 1693651162, PC: 1691333639, Mac: 784629370, 'Surface Pro': 1750962834};
function rqCSV(t){ const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){ const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => { let k = r.length; while (k > 0 && r[k - 1] === '') k--; return r.slice(0, k); }); }
const rqN = h => String(h || '').replace(/\s+/g, ' ').trim();
const rqC = v => { v = rqN(v); return ['', '—', '-', '–', 'x'].includes(v) ? null : v; };
function rqSections(vals){
  const out = [], notes = []; let i = 0; const isH = r => r && rqN(r[0]) === 'Model';
  while (i < vals.length){ const r = vals[i];
    if (i + 1 < vals.length && isH(vals[i + 1])){
      const title = rqN(r && r[0]), hdr = vals[i + 1].map(rqN), rows = []; let j = i + 2;
      while (j < vals.length && vals[j] && rqN(vals[j][0]) && !(j + 1 < vals.length && isH(vals[j + 1]))){ rows.push(vals[j]); j++; }
      (r || []).slice(1).map(rqN).filter(x => x && /\d/.test(x)).forEach(x => notes.push(x));
      out.push([title, hdr, rows]); i = j;
    } else { if (r && rqN(r[0]) && !(i + 1 < vals.length && isH(vals[i + 1]))){ const t = r.map(rqN).filter(Boolean).join(' · '); if (t) notes.push(t); } i++; } }
  return [out, notes]; }
function rqBuild(V){
  const cats = {}; const cat = (k, n) => cats[k] || (cats[k] = {name: n, cols: null, models: [], notes: []});
  const add = (c, g, hdr, rows) => { const keep = []; for (let k = 1; k < hdr.length; k++) if (hdr[k]) keep.push(k);
    if (!c.cols) c.cols = keep.map(k => hdr[k]);
    for (const r0 of rows){ const r = r0.concat(Array(Math.max(0, hdr.length - r0.length)).fill('')); const p = keep.map(k => rqC(r[k])); if (p.some(Boolean)) c.models.push({n: rqN(r[0]), g, p}); } };
  let [secs, notes] = rqSections(V.Apple);
  const amap = {'APPLE iPHONE': ['iphone', 'iPhone'], 'APPLE iPAD': ['ipad', 'iPad'], 'APPLE WATCH': ['watch', 'Apple Watch'], 'APPLE iPOD': ['ipod', 'iPod']};
  for (const [t, h, rows] of secs){ const m = amap[t]; if (m) add(cat(m[0], m[1]), '', h, rows); }
  for (const k of ['iphone', 'ipad', 'watch', 'ipod']) if (cats[k]) cats[k].notes = notes.filter(x => /labor/i.test(x));

}
const rqDevice = (k, m) => k === 'watch' ? 'Apple Watch ' + m.n : k === 'computer' ? (m.g === 'Mac' ? 'Mac' : 'PC') : k === 'pixel' && !/pixel/i.test(m.n) ? 'Pixel ' + m.n : k === 'samsung' && !/galaxy|note/i.test(m.n) ? 'Galaxy ' + m.n : m.n;
const rqIssue = (k, m) => ({iphone: 'iPhone Repair', samsung: 'Smartphone Repair', pixel: 'Smartphone Repair', moto: 'Smartphone Repair', watch: 'Smartphone Repair', ipod: 'Smartphone Repair', ipad: 'iPad Repair', surface: 'Tablet Repair', console: 'Game Console Repair'})[k] || (m.g === 'Mac' ? 'Macbook Repair' : 'Computer Repair');
/* Repair names never say "screen": it's Glass Repair, LCD Replacement or OLED Replacement, depending on the part.

   (6 through 8 Plus, SE, XR, 11) say LCD on every tier; Samsung A0x / A1x phones are LCD, other Galaxys are OLED. */
const RQ_TIER = {GOOD: 'Good', BETTER: 'Better', BEST: 'Best'};
const lcdIphone = n => /^iphone (5|5s|5c|6|6s|7|8|se|xr|11)( plus)?\b(?! pro)/i.test(String(n).trim()) && !/11 pro/i.test(n);

const rqColLabel = (col, k, m) => { const n = m?.n || '', t = /^(GOOD|BETTER|BEST)\s+(.*)$/.exec(col);

    if (t[1] === 'GOOD') return 'LCD Replacement (Aftermarket)';

  if (/^glass only \+ burn/i.test(col)) return 'Glass Repair + Burn-in';
  if (/^glass only/i.test(col)) return 'Glass Repair';
  if (/^screen replacement$/i.test(col)) return k === 'samsung' && lcdSamsung(n) ? 'LCD Replacement' : 'OLED Replacement';
  if (/^screen \(standard\)$/i.test(col)) return 'OLED Replacement (Standard)';

const rqMatch = (x, q) => { const hay = (rqDevice(x.k, x.m) + ' ' + x.m.g + ' ' + x.c.name + ' ' + x.m.n + (x.m.g === 'Mac' ? ' macbook imac' : x.m.g === 'PC' ? ' laptop windows' : '')).toLowerCase().replace(/playstation\s*/g, 'ps').replace(/series\s*/g, 'series ');

  $('#w-next').onclick = () => { S.week = new Date(ws.getTime() + 7*86400000); viewHours(el); };

    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded ' + filename); }
    catch { toast('Download failed. Use Copy for accountant instead.'); }

      }; });
  });
}

/* ---------------- REPAIRSHOPR IMPORT (owner) ----------------
   Runs in this browser tab: reads RepairShopr's API with a read-only key the owner pastes (kept in memory only, never saved),
   and writes each page into the POS database through pos_import (owner PIN). Resumable; safe to run again (rows match on RepairShopr id). */
const RS_API = 'https://cellularzone.repairshopr.com/api/v1/';
const RS_ST = {'new': 'new', 'in progress': 'progress', 'awaiting approval': 'approval', 'awaiting device': 'device', 'scheduled': 'scheduled', 'waiting for parts': 'parts',
  'waiting on customer': 'customer', 'customer reply': 'reply', 'board level': 'board', 'resolved': 'resolved'};
const rsStore = n => /bulverde/i.test(n || '') ? 'BV' : /potranco/i.test(n || '') ? 'PT' : /babcock|zavala|dz/i.test(n || '') ? 'DZ' : null;
const RSI = {log: [], running: false, stop: false, loc: {1163: 'BV', 1931: 'PT', 1164: 'DZ'}, tally: {}, unknownSt: {}, unknownLoc: {}};   /* RepairShopr location ids (Admin → Locations) */
function rsiState(){ try { return JSON.parse(localStorage.getItem('czpos-rsimport') || '{}'); } catch { return {}; } }
function rsiSave(st){ try { localStorage.setItem('czpos-rsimport', JSON.stringify(st)); } catch {} }
/* Chrome slows timers in a background tab to about once a minute, which made the import look stuck.
   Waiting through a worker keeps the pace when the tab isn't in front. */
const rsSleep = (() => { try { const w = new Worker(URL.createObjectURL(new Blob(['onmessage = e => setTimeout(() => postMessage(e.data[0]), e.data[1])'], {type: 'text/javascript'})));
  const wait = new Map(); let n = 0; w.onmessage = e => { const f = wait.get(e.data); wait.delete(e.data); f && f(); };
  return ms => new Promise(r => { const id = ++n; wait.set(id, r); w.postMessage([id, ms]); }); } catch { return ms => new Promise(r => setTimeout(r, ms)); } })();
async function rsGet(tok, path, params = {}){
  const u = new URL(RS_API + path); Object.entries(params).forEach(([k, v]) => v != null && u.searchParams.set(k, v));
  for (let tries = 0; ; tries++){
    let r; try { r = await fetch(u, {headers: {Authorization: 'Bearer ' + tok, Accept: 'application/json'}}); } catch (e) { if (tries < 5) { await rsSleep(5000); continue; } throw e; }
    if (r.status === 429 || r.status >= 500) { if (tries < 8) { await rsSleep(15000); continue; } }
    if (r.status === 401) throw new Error('RepairShopr rejected the API key (401). Check it was pasted in full.');
    if (r.status === 403) throw Object.assign(new Error(`The API key isn't allowed to read ${path.split('/')[0]} (403). Add that permission to the key in RepairShopr.`), {code: 403});
    if (!r.ok) throw new Error(`RepairShopr ${path} → ${r.status}`);
    await rsSleep(340);   /* stay under ~180 requests a minute */
    return r.json();
  }
}
const phone10 = (...a) => { for (const x of a) { const d = String(x || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, ''); if (d.length === 10) return d; } return ''; };
function rsCust(c){ const store = RSI.loc[c.location_id] || rsStore(c.location_name) || null;
  return {rs_id: c.id, name: (c.fullname || [c.firstname, c.lastname].filter(Boolean).join(' ') || c.business_name || '').trim(), phone: phone10(c.mobile, c.phone), email: c.email || '',
    store, address: [c.address, c.address_2, c.city, c.state, c.zip].filter(Boolean).join(', '), notes: c.notes || '', business: c.business_name || '', created_at: c.created_at}; }
function rsTicket(t){
  const label = String(t.status || '').trim(); let status = RS_ST[label.toLowerCase()]; if (!status) { RSI.unknownSt[label] = (RSI.unknownSt[label] || 0) + 1; status = 'progress'; }
  let store = RSI.loc[t.location_id] || rsStore(t.location_name);
  if (!store) { RSI.unknownLoc[t.location_id || 'none'] = (RSI.unknownLoc[t.location_id || 'none'] || 0) + 1; store = 'DZ'; }
  const props = t.properties || {}; const pk = re => { const k = Object.keys(props).find(k => re.test(k)); return k ? String(props[k] ?? '').trim() : ''; };
  const comments = Array.isArray(t.comments) ? t.comments.map(c => ({id: 'rs' + c.id, at: c.created_at, by: c.tech || '', text: ((c.subject && !/^(update|initial issue)$/i.test(c.subject) ? c.subject + ': ' : '') + String(c.body || '')).slice(0, 3000), pub: !c.hidden, sys: false}))
    .sort((a, b) => new Date(b.at) - new Date(a.at)) : null;
  RSI.tally[t.id] = status === 'resolved' ? null : store + '|' + label;
  return {rs_id: t.id, number: parseInt(t.number, 10) || null, customer_rs_id: t.customer_id, store, device: pk(/model|device/i), imei: pk(/imei|serial/i), passcode: pk(/pass/i),
    issue: t.problem_type || '', subject: t.subject || '', status, rs_status: label, priority: Math.min(3, Math.max(0, parseInt(t.priority, 10) || 2)),

function rsInvoice(i){ return {rs_id: i.id, number: parseInt(i.number, 10) || null, at: i.date || i.created_at, store: RSI.loc[i.location_id] || rsStore(i.location_name) || 'DZ', ticket_rs_id: i.ticket_id, customer_rs_id: i.customer_id,
  lines: (i.line_items || []).map(l => ({desc: l.name || l.item || '', price: +l.price || 0, qty: +l.quantity || 1, cat: 'RepairShopr'})), payment: '', subtotal: +i.subtotal || 0, tax: +i.tax || 0, total: +i.total || 0, paid: !!i.is_paid}; }
function rsProduct(p){ const qty = {DZ: 0, BV: 0, PT: 0}; (p.location_quantities || []).forEach(l => { const st = RSI.loc[l.location_id]; if (st) qty[st] += +l.quantity || 0; else if (+l.quantity) RSI.unknownLoc['old location ' + l.location_id + ' (stock)'] = (RSI.unknownLoc['old location ' + l.location_id + ' (stock)'] || 0) + 1; });
  if (!(p.location_quantities || []).length && p.quantity) qty.DZ += +p.quantity;
  return {rs_id: p.id, name: p.name, description: p.description || '', category: p.product_category || p.category_path || '', upc: p.upc_code || '', price: +p.price_retail || 0, cost: +p.price_cost || 0, qty, maintain_stock: !!p.maintain_stock, disabled: !!p.disabled}; }

async function rsImportRun(tok, mode, ui){
  const owner = S.user; const st = rsiState(); RSI.running = true; RSI.stop = false; const say = m => { RSI.log.unshift(new Date().toLocaleTimeString() + ' · ' + m); RSI.log = RSI.log.slice(0, 60); ui(); };
  if (st.loc) Object.assign(RSI.loc, st.loc);
  const startedAt = new Date().toISOString();
  const pages = async (kind, path, key, map, params = {}) => {
    let page = mode === 'full' ? (st[kind + 'Page'] || 1) : 1; let total = null;
    while (!RSI.stop){
      const j = await rsGet(tok, path, {...params, page}); const list = j[key] || []; total = j.meta?.total_pages || total;
      if (!list.length) break;
      const rows = list.map(map); const clean = rows.map(({_needDetail, ...r}) => r);
      if (kind === 'tickets') { const need = [...new Set(clean.map(r => r.customer_rs_id).filter(Boolean))]; RSI.needCust = need; }
      await Store.importRows(owner, kind, clean);
      if (kind === 'tickets') rows.filter(r => r._needDetail).forEach(r => RSI.detail.add(r.rs_id));
      st[kind + 'Page'] = page + 1; st.loc = RSI.loc; if (mode === 'full') rsiSave(st);
      say(`${kind}: page ${page}${total ? ' of ' + total : ''} (${list.length})`);
      if (total && page >= total) break; page++;
    }
    if (!RSI.stop && mode === 'full') { st[kind + 'Done'] = true; rsiSave(st); }
  };
  RSI.detail = new Set();
  try {
    if (mode === 'full'){
      if (!st.customersDone) await pages('customers', 'customers', 'customers', rsCust);
      if (!RSI.stop && !st.ticketsDone) await pages('tickets', 'tickets', 'tickets', rsTicket);
      if (!RSI.stop && !st.invoicesDone) await pages('invoices', 'invoices', 'invoices', rsInvoice);
      if (!RSI.stop && !st.productsDone) { try { await pages('products', 'products', 'products', rsProduct); } catch (e) { if (e.code === 403) say('Products skipped: ' + e.message); else throw e; } }
    } else {
      const since = st.lastSync || st.fullStartedAt; if (!since) throw new Error('Run the full import first.');
      /* catch-up: tickets and invoices changed since the last run, plus any customer they point to */
      for (const [kind, map] of [['tickets', rsTicket], ['invoices', rsInvoice]]) {
        let page = 1;
        while (!RSI.stop){ const j = await rsGet(tok, kind, {since_updated_at: since, page}); const list = j[kind] || []; if (!list.length) break;
          const custIds = [...new Set(list.map(x => x.customer_id).filter(Boolean))];
          const custs = []; for (const id of custIds) { try { const c = await rsGet(tok, 'customers/' + id); if (c.customer) custs.push(rsCust(c.customer)); } catch {} }
          if (custs.length) await Store.importRows(owner, 'customers', custs);
          const rows = list.map(map); await Store.importRows(owner, kind, rows.map(({_needDetail, ...r}) => r)); if (kind === 'tickets') rows.filter(r => r._needDetail).forEach(r => RSI.detail.add(r.rs_id));
          say(`catch-up ${kind}: page ${page} (${list.length})`); if (j.meta?.total_pages && page >= j.meta.total_pages) break; page++; }
      }
      try { let page = 1; while (!RSI.stop) { const j = await rsGet(tok, 'products', {page}); if (!(j.products || []).length) break; await Store.importRows(owner, 'products', j.products.map(rsProduct)); say(`products: page ${page}`); if (j.meta?.total_pages && page >= j.meta.total_pages) break; page++; } } catch (e) { if (e.code === 403) say('Products skipped: ' + e.message); else throw e; }
    }
    /* open tickets whose list entry had no notes: pull each one for its notes */
    if (!RSI.stop && RSI.detail.size) { let n = 0; for (const id of RSI.detail) { if (RSI.stop) break; const j = await rsGet(tok, 'tickets/' + id); if (j.ticket) { const {_needDetail, ...r} = rsTicket(j.ticket); await Store.importRows(owner, 'tickets', [r]); } if (++n % 10 === 0) say(`notes for open tickets: ${n} of ${RSI.detail.size}`); } }
    if (!RSI.stop) { if (mode === 'full' && !st.fullStartedAt) st.fullStartedAt = startedAt; st.lastSync = startedAt; rsiSave(st); say(RSI.stop ? 'Paused.' : 'Done.'); }
  } catch (e) { say('Stopped: ' + e.message); }
  RSI.running = false; ui();
}

        ${[...new Set(Object.values(sum.open || {}).flatMap(o => Object.keys(o)))].sort().map(lbl => `<tr><td>${esc(lbl)}</td>${Object.keys(STORES).map(k => `<td class="r num">${sum.open?.[k]?.[lbl] || 0}</td>`).join('')}</tr>`).join('')}
        <tr><td><b>All open</b></td>${Object.keys(STORES).map(k => `<td class="r num"><b>${Object.values(sum.open?.[k] || {}).reduce((a, b) => a + b, 0)}</b></td>`).join('')}</tr></tbody></table></div>` : ''}
      <div class="small mono" style="max-height:220px;overflow:auto;background:var(--soft);border-radius:8px;padding:8px">${RSI.log.map(esc).join('<br>') || 'Not started.'}</div></div>`;
    const key = () => { const k = box.querySelector('#rsi-k').value.trim(); if (!k) { toast('Paste the RepairShopr API key first.'); return null; } RSI.key = k; return k; };
    if (RSI.key) box.querySelector('#rsi-k').value = RSI.key;
    box.querySelector('#rsi-full').onclick = () => { const k = key(); if (k) rsImportRun(k, 'full', () => { Object.assign(st, rsiState()); draw(); }); };
    box.querySelector('#rsi-catch').onclick = () => { const k = key(); if (k) rsImportRun(k, 'catch', () => { Object.assign(st, rsiState()); draw(); }); };
    box.querySelector('#rsi-stop') && (box.querySelector('#rsi-stop').onclick = () => { RSI.stop = true; toast('Pausing after this page…'); });
    box.querySelector('#rsi-now') && (box.querySelector('#rsi-now').onclick = async ev => { ev.target.disabled = true; ev.target.textContent = 'Running…'; try { const r = await Store.rsSyncNow(); toast(r && r.skipped ? 'Already running.' : 'Catch-up done.'); } catch (x) { toast(x.message); } auto = await Store.rsSync().catch(() => auto); draw(); });
    box.querySelector('#rsi-sum').onclick = async () => { try { sum = await Store.importSummary(S.user); draw(); } catch (e) { toast(e.message); } };
  };
  draw();
}

const CALL_SRC = [['Google Ads (paid)', true], ['Google Business Profile (organic)', false], ['Website (organic)', false], ['Facebook / Instagram ads', true], ['Other paid ad', true], ['Main store number', false]];
async function callSourcesPanel(box){
  const list = await Store.callSources();
  box.innerHTML = `<div class="panel stack"><h2>Call tracking numbers</h2>
    <p class="small muted" style="margin:0">Each tracking number in GoHighLevel goes in one place: the Google Ads call ads, the Google Business Profile listing, the website, and so on. List them here and every inbound call in the Inbox gets tagged paid or organic. Calls to numbers not listed fall back to GoHighLevel's own source info, or show "Unknown".</p>
    <div class="tbl"><table><thead><tr><th>Number</th><th>Used on</th><th>Store</th><th></th></tr></thead><tbody>
    ${list.map(x => `<tr><td class="num">${fmtPhone(x.number)}</td><td><span class="pill ${x.paid ? 'warn' : 'ok'}">${esc(x.label)}</span></td><td>${x.store ? STORES[x.store] : 'All'}</td><td class="r"><button data-csd="${x.number}" style="min-height:32px;padding:3px 10px">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No numbers yet.</td></tr>'}
    </tbody></table></div>
    <div class="grid g3"><div class="field"><label class="label" for="cs-n">Tracking number</label><input id="cs-n" inputmode="tel" placeholder="210 555 0100"></div>
      <div class="field"><label class="label" for="cs-l">Used on</label><select id="cs-l">${CALL_SRC.map(([l]) => `<option>${esc(l)}</option>`).join('')}</select></div>
      <div class="field"><label class="label" for="cs-s">Store</label><select id="cs-s"><option value="">All stores</option>${Object.entries(STORES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div></div>
    <div class="err" id="cs-e" role="alert"></div><button id="cs-add" style="align-self:flex-start">Add number</button></div>`;
  box.querySelector('#cs-add').onclick = async () => { const n = box.querySelector('#cs-n').value.replace(/\D/g, '').slice(-10); const l = box.querySelector('#cs-l').value;
    if (n.length !== 10) { box.querySelector('#cs-e').textContent = 'Enter the 10-digit tracking number.'; return; }
    try { await Store.saveCallSource(S.user, {number: n, label: l, paid: (CALL_SRC.find(x => x[0] === l) || [, false])[1], store: box.querySelector('#cs-s').value}); toast('Tracking number saved'); callSourcesPanel(box); } catch (e) { box.querySelector('#cs-e').textContent = e.message; } };
  box.querySelectorAll('[data-csd]').forEach(b => b.onclick = async () => { try { await Store.saveCallSource(S.user, {number: b.dataset.csd, delete: true}); callSourcesPanel(box); } catch (e) { toast(e.message); } });
}

    </tbody></table></div>

      if (err) { L.querySelector('#e-err').textContent = err; return; }

/* Stay on the newest version: a store computer that keeps the POS open all day would otherwise run old code
   (that's how a buyback label printed in the old format). Every 5 minutes, check the published page; when it changed,
   reload by itself on the PIN screen or when the tab is in the background, otherwise show an "Update now" bar. */
(function autoUpdate(){
  if (!window.CZ_BUILD) return;
  let ready = false;
  const safe = () => (!S.user || S.tab === 'clock' || document.hidden) && !document.querySelector('#layer .sheet');   /* on the PIN screen or in the background */
  const bar = () => { if (document.getElementById('cz-upd')) return; const b = document.createElement('div'); b.id = 'cz-upd';
    b.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#1d4ed8;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25);font:600 14px system-ui,sans-serif;max-width:calc(100vw - 32px)';
    b.innerHTML = '<span>A new version of the POS is ready.</span><button style="background:#fff;color:#1d4ed8;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer">Update now</button>';
    b.querySelector('button').onclick = () => location.reload(); document.body.appendChild(b); };
  const check = async () => {
    try { if (!ready) { const t = await fetch(location.pathname + '?u=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.text() : ''); const m = t.match(/CZ_BUILD="(\d+)"/); if (m && m[1] !== window.CZ_BUILD) ready = true; } } catch {}
    if (ready) { if (safe()) location.reload(); else bar(); } };
  setInterval(check, 5 * 60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
  setTimeout(check, 20000);
})();
</script>

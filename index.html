:root{

  --bg:#0f1115;--panel:#181b21;--ink:#e8eaee;--muted:#9aa2ae;--line:#2a2f38;--soft:#21252d;
  --accent:#7aa2ff;--accent-ink:#0b1020;--accent-soft:#1c2744;
  --ok:#4fd18a;--ok-soft:#14301f;--warn:#f2b45a;--warn-soft:#33270f;--bad:#ff8a80;--bad-soft:#3a1715;color-scheme:dark}}
:root[data-theme="dark"]{

  --ok:#4fd18a;--ok-soft:#14301f;--warn:#f2b45a;--warn-soft:#33270f;--bad:#ff8a80;--bad-soft:#3a1715;color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-height:44px;width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}

.banner{border-radius:var(--r);padding:10px 14px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.ok{background:var(--ok-soft);color:var(--ok)}.banner.acc{background:var(--accent-soft);color:var(--accent)}

.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;letter-spacing:-.01em}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

table{border-collapse:collapse;width:100%;font-size:14px}

.appbar .right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.appbar input{background:var(--bar-hi);border:0;color:#fff;min-height:36px;width:180px;max-width:46vw;padding:6px 10px}

.appbar .new{background:var(--bar-acc);color:#fff;font-weight:600}

.crumb{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.statusbar{display:flex;gap:6px;flex-wrap:wrap}
.statusbar button{min-height:36px;padding:6px 12px;border-radius:999px;font-size:13px}
.statusbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:4px;white-space:nowrap}
.st-new{background:#e0ecff;color:#1849a9}.st-prog{background:#fff0d6;color:#8a4b00}.st-parts{background:#fde2e1;color:#a4231b}
.st-cust{background:#efe3fb;color:#6b2bb0}.st-board{background:#dff5f3;color:#0b6b62}.st-res{background:#ececec;color:#555}
.st-appr{background:#fff4c2;color:#7a5a00}.st-dev{background:#e8eaef;color:#3d4757}.st-sched{background:#dcefff;color:#0d5c99}.st-reply{background:#ffe1f0;color:#a0195c}
select.stsel{appearance:none;-webkit-appearance:none;border:0;border-radius:4px;font-size:12px;font-weight:600;min-height:28px;padding:3px 22px 3px 9px;width:auto;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 12px,calc(100% - 7px) 12px;background-size:4px 4px;background-repeat:no-repeat}
select.techsel{font-size:13px;min-height:30px;padding:3px 6px;width:auto;max-width:150px}
.timeline{display:flex;flex-direction:column;gap:10px}
.timeline .c{border-left:3px solid var(--line);padding:4px 0 4px 12px;border-radius:0}
.timeline .c.pub{border-left-color:var(--accent)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

    po.status = po.lines.every(x => x.received >= x.qty) ? 'received' : 'partial';

/* ============================================================
   LIVE STORE — Supabase. Every write goes through a database
   function that checks the PIN, so a store computer can't
   change anything without a valid employee PIN.
   ============================================================ */
const LiveStore = {
  mode: 'live',
  sb: null, pinCache: new Map(),
  async init(){
    this.sb = window.supabase.createClient(CZ_CONFIG.supabaseUrl, CZ_CONFIG.supabaseKey);
    const {data} = await this.sb.auth.getSession();
    if (!data.session) throw Object.assign(new Error('signin'), {code: 'signin'});

function sheet(html, onMount){
  const L = $('#layer');
  L.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="panel stack">${html}</div></div>`;
  const close = () => { L.innerHTML = ''; };
  L.querySelector('.sheet').addEventListener('click', e => { if (e.target.classList.contains('sheet')) close(); });
  L.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  onMount && onMount(L, close);
  return close;
}

/* ask any employee (or a manager) for a PIN inside the page */
function askPin(title, needRank = 0){
  return new Promise(resolve => {
    let pin = '';
    const close = sheet(`
      <div class="row" style="justify-content:space-between"><h3>${esc(title)}</h3><button data-close aria-label="Cancel">Cancel</button></div>
      <div class="pinshow" id="ps">${'<i></i>'.repeat(4)}</div>
      <div class="err" id="pe" role="alert"></div>
      <div class="pad" id="pp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' : `<button data-k="${k}">${k}</button>`).join('')}</div>`,
      (L, close) => {
        const draw = () => L.querySelectorAll('#ps i').forEach((i, n) => i.classList.toggle('on', n < pin.length));
        L.querySelector('#pp').onclick = async e => {
          const k = e.target.dataset.k; if (k == null) return;
          L.querySelector('#pe').textContent = '';
          if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
          draw();
          if (pin.length === 4) {
            const emp = await Store.verifyPin(pin);
            if (!emp || RANK[emp.role] < needRank) {
              L.querySelector('#pe').textContent = !emp ? 'That PIN didn\'t match anyone. Try again.' : `${emp.name} can't approve this. A manager PIN is needed.`;
              pin = ''; draw(); return;
            }
            close(); resolve(emp);
          }
        };
        L.querySelector('[data-close]').addEventListener('click', () => resolve(null));
      });
  });
}

const custById = list => Object.fromEntries(list.map(c => [c.id, c]));
const fmtPhone = p => { const d = (p || '').replace(/\D/g, ''); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p || ''); };
const ago = d => { const m = Math.floor((Date.now() - new Date(d)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.floor(m/60) + 'h ago' : Math.floor(m/1440) + 'd ago'; };
function ticketFlag(t){
  const age = daysOld(t.updatedAt);
  if (t.status === 'parts' && daysOld(t.createdAt) >= 5) return ['bad', `${daysOld(t.createdAt)}d waiting on parts`];
  if (t.status === 'customer' && age >= 3) return ['warn', `Waiting on customer ${age}d`];
  if (t.status === 'reply') return ['bad', 'Customer replied'];
  if (t.status === 'approval' && age >= 1) return ['warn', `Awaiting approval ${age}d`];
  if (t.status === 'new' && Date.now() - new Date(t.createdAt) > 3*3600000) return ['warn', 'Not started'];
  return null;
}

const KIND = {call: 'Call', missed: 'Missed call', voicemail: 'Voicemail', sms: 'Text', other: 'Message'};
const KIND_PILL = {call: 'ok', missed: 'bad', voicemail: 'warn', sms: 'acc', other: ''};
async function renderThread(box, store, c){
  if (!box) return;
  if (!c?.phone) { box.textContent = 'No phone number on file.'; return; }
  try {
    const list = await Store.ghlThread(store, c);
    box.className = 'timeline';
    box.innerHTML = list.length ? list.slice(0, 20).map(m => {
      const call = /CALL/i.test(m.type); const out = m.direction === 'outbound';
      const label = call ? (m.status === 'voicemail' ? 'Voicemail' : m.status === 'missed' || m.status === 'no-answer' ? 'Missed call' : `Call${m.duration ? ' · ' + Math.round(m.duration / 60) + ' min' : ''}`) : (out ? 'Text sent' : 'Text received');
      return `<div class="c ${out ? 'pub' : ''}"><div class="small muted">${label} · ${new Date(m.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div>${m.body ? `<div>${esc(m.body)}</div>` : ''}</div>`;
    }).join('') : '<span class="small muted">No calls or texts with this number yet.</span>';
  } catch (e) { box.className = 'small'; box.innerHTML = `<span style="color:var(--warn)">Couldn't load GoHighLevel: ${esc(e.message)}</span>`; }
}

async function viewInbox(el){

  const due = reviews.filter(r => r.status === 'scheduled').length;
  el.innerHTML = `<div class="stack"><div class="statusbar" role="group" aria-label="Inbox section">
      <button data-ib="calls" aria-pressed="${S.ibTab === 'calls'}">Calls &amp; texts</button>
      <button data-ib="leads" aria-pressed="${S.ibTab === 'leads'}">Website leads${newLeads ? ` (${newLeads} new)` : ''}</button>
      <button data-ib="reviews" aria-pressed="${S.ibTab === 'reviews'}">Review requests${due ? ` (${due} scheduled)` : ''}</button></div><div id="ib"></div></div>`;
  el.querySelectorAll('[data-ib]').forEach(b => b.onclick = () => { S.ibTab = b.dataset.ib; viewInbox(el); });

        <button data-acc="custom" style="min-height:64px;text-align:left"><b>Other item</b><div class="small muted">Type a name and price</div></button></div>
      ${upsellBox(set)}
    </div>
    <div class="panel stack"><h2>Sale</h2>
      ${S.cart.length ? `<div class="tbl"><table><tbody>${S.cart.map((l, i) => `<tr><td>${esc(l.desc)}<div class="small muted">${esc(l.cat)}</div></td><td class="r num">${cents(l.price)}</td><td class="r"><button data-rmc="${i}" aria-label="Remove ${esc(l.desc)}" style="min-height:32px;padding:2px 10px">✕</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Tap an item to add it.</p>'}
      <div class="row" style="justify-content:space-between"><span class="label">Total</span><span class="num" style="font-size:26px">${cents(total)}</span></div>
      <div class="field"><label class="label" for="rg-ph">Customer phone (optional)</label><input id="rg-ph" inputmode="tel" value="${esc(S.cartPhone || '')}" placeholder="Leave blank for walk-in"></div>
      <div class="field"><label class="label" for="rg-pay">Paid with</label><select id="rg-pay">${PAYMENTS.map(p => `<option>${p}</option>`).join('')}</select></div>

      <div class="err" id="rg-err" role="alert"></div>
      <button class="primary" id="rg-go" ${S.cart.length ? '' : 'disabled'} style="min-height:52px;font-size:16px">Record sale</button>
    </div></div>`;
  el.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => {

      <div class="field"><label class="label" for="ci-n">Item</label><input id="ci-n" placeholder="Otterbox case"></div>

  rq.onkeydown = e => { if (e.key === 'Enter') { const v = rq.value.trim(); const p = S.prods.find(x => x.upc && x.upc === v) || (S.prods.filter(x => prodMatch(x, v)).length === 1 ? S.prods.find(x => prodMatch(x, v)) : null); if (p) addProd(p); } };
  if (exact) { addProd(exact); return; }

  $('#rg-pay').onchange = e => { $('#rg-sq').hidden = !e.target.value.startsWith('Square'); };

  };
}

/* ---------------- CLOSE OUT (end of day) + PAYOUT REQUESTS ---------------- */
S.coDay = null;
async function viewCloseout(el){
  const day = S.coDay || dayKey(new Date()); const t0 = new Date(day + 'T00:00'); const t1 = new Date(t0); t1.setDate(t1.getDate() + 1);
  const [invs, bbsAll, closes, set] = await Promise.all([Store.invoices(t0, t1), Store.buybacksAll().catch(() => []), Store.closeouts(), Store.settings()]);
  const inv = invs.filter(i => i.store === S.store);
  const bbs = bbsAll.filter(b => b.store === S.store && new Date(b.at) >= t0 && new Date(b.at) < t1);
  const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
  const by = PAYMENTS.map(p => [p, sum(inv.filter(i => i.payment === p), i => i.total)]);
  const out = PAYOUTS.map(p => [p, sum(bbs.filter(b => b.payout === p), b => b.paid)]);
  const cashIn = by.find(x => x[0] === 'Cash')[1], cashOut = out.find(x => x[0] === 'Cash')[1];
  const done = closes.find(c => c.store === S.store && c.day === day);
  const expected = (done?.float ?? set.float) + cashIn - cashOut;
  const pending = bbsAll.filter(b => b.payoutStatus === 'requested' && (can(3) || b.store === S.store));
  el.innerHTML = `<div class="stack">
    ${pending.length ? `<div class="panel stack"><h2>Payout requests</h2><p class="muted small" style="margin:0">Sellers paid by Apple Pay, Cash App or Zelle. Each one went to Sam as an alert${Store.mode === 'live' ? ' and a Slack message' : ''} with its buyback ID.</p>
      <div class="tbl"><table><thead><tr><th>Buyback ID</th><th>Seller</th><th>Send to</th><th class="r">Amount</th><th>Requested</th><th></th></tr></thead><tbody>
      ${pending.map(b => `<tr><td class="num"><b>${esc(b.bbId)}</b></td><td>${esc(b.seller.firstName)} ${esc(b.seller.lastName)}<div class="small muted num">${fmtPhone(b.seller.phone)}</div></td><td>${esc(b.payout)}: <b>${esc(b.payoutTo || '—')}</b></td><td class="r num">${cents(b.paid)}</td><td class="small">${ago(b.at)} · ${STORES[b.store]}</td>
        <td class="r">${can(3) ? `<button class="primary" data-paid="${b.id}" style="min-height:34px;padding:4px 10px">Mark sent</button>` : '<span class="pill warn">Waiting on Sam</span>'}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><h2>Close out · ${STORES[S.store]}</h2><input type="date" id="co-day" value="${day}" style="width:auto"></div>
      <div class="grid g2">
        <div class="stack"><span class="label">Money in</span><div class="tbl"><table><tbody>${by.map(([p, v]) => `<tr><td>${p}</td><td class="r num">${cents(v)}</td></tr>`).join('')}<tr><td><b>Total sales</b></td><td class="r num"><b>${cents(sum(inv, i => i.total))}</b></td></tr></tbody></table></div>
          <span class="small muted">Square total should match the Square app's report for today. Acima should match the Acima portal.</span></div>
        <div class="stack"><span class="label">Buyback payouts</span><div class="tbl"><table><tbody>${out.map(([p, v]) => `<tr><td>${p}</td><td class="r num">${cents(v)}</td></tr>`).join('')}<tr><td><b>${bbs.length} buys</b></td><td class="r num"><b>${cents(sum(bbs, b => b.paid))}</b></td></tr></tbody></table></div></div>
      </div>
      <div class="grid g3">
        <div class="stat"><span class="label">Starting cash</span><span class="v">${cents(done?.float ?? set.float)}</span></div>
        <div class="stat"><span class="label">+ cash sales − cash buys</span><span class="v">${cents(cashIn - cashOut)}</span></div>
        <div class="stat"><span class="label">Drawer should have</span><span class="v">${cents(expected)}</span></div>
      </div>
      ${done ? `<div class="banner ${Math.abs(done.variance) < 5 ? 'ok' : 'bad'}">Closed by ${esc(staffName(done.by))} at ${fmtTime(done.at)}. Counted ${cents(done.counted)} · ${done.variance === 0 ? 'exact' : (done.variance > 0 ? 'over ' : 'short ') + cents(Math.abs(done.variance))}. Square ${cents(done.square)} in the POS vs ${done.squareApp != null ? cents(done.squareApp) : '—'} in the Square app.${done.notes ? ' Note: ' + esc(done.notes) : ''}</div>`
      : `<div class="grid g2">
          <div class="field"><label class="label" for="co-cash">Cash counted in the drawer</label><input id="co-cash" inputmode="decimal" placeholder="${expected.toFixed(2)}"></div>
          <div class="field"><label class="label" for="co-sq">Square app total for today</label><input id="co-sq" inputmode="decimal" placeholder="${by[0][1].toFixed(2)}"></div></div>
        <div class="field"><label class="label" for="co-n">Notes</label><input id="co-n" placeholder="Explain anything over or short"></div>
        <div class="err" id="co-err" role="alert"></div>
        <button class="primary" id="co-go">Close out ${fmtDate(t0)}</button>`}
    </div>
    <div class="panel stack"><h3>Recent close-outs</h3><div class="tbl"><table><thead><tr><th>Day</th><th>Store</th><th class="r">Expected</th><th class="r">Counted</th><th class="r">Over / short</th><th>By</th></tr></thead><tbody>
      ${closes.filter(c => can(3) || c.store === S.store).slice(0, 20).map(c => `<tr><td>${c.day}</td><td>${c.store}</td><td class="r num">${cents(c.expected)}</td><td class="r num">${cents(c.counted)}</td><td class="r num" style="color:${Math.abs(c.variance) < 5 ? 'inherit' : 'var(--bad)'}">${c.variance >= 0 ? '+' : '−'}${cents(Math.abs(c.variance))}</td><td class="small">${esc(staffName(c.by))}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No close-outs yet.</td></tr>'}
    </tbody></table></div></div></div>`;
  $('#co-day').onchange = e => { S.coDay = e.target.value; viewCloseout(el); };

  $('#co-go') && ($('#co-go').onclick = async () => {

    await Store.saveCloseout(S.user, S.store, {day, float: set.float, cashIn, cashOut, expected, counted, variance, square: by[0][1], squareApp: sqa, acima: by.find(x => x[0] === 'Acima')[1], payouts: Object.fromEntries(out), sales: sum(inv, i => i.total), notes: $('#co-n').value.trim()});

    $('#back').onclick = () => { S.cnt = null; viewCounts(el); };
    const add = () => { const v = $('#ct-scan').value.trim(); if (!v) return; const d = onHand.find(x => String(x.stockNo) === v);
      if (d) seen.add(d.id); else if (!extra.includes(v)) extra.push(v); viewCounts(el).then(() => $('#ct-scan').focus()); };
    $('#ct-add').onclick = add; $('#ct-scan').onkeydown = e => { if (e.key === 'Enter') add(); }; $('#ct-scan').focus();
    el.querySelectorAll('[data-cd]').forEach(tr => tr.onclick = () => { seen.has(tr.dataset.cd) ? seen.delete(tr.dataset.cd) : seen.add(tr.dataset.cd); viewCounts(el); });
    $('#ct-save').onclick = async () => {
      const missing = onHand.filter(d => !seen.has(d.id)).map(d => `#${d.stockNo} ${d.model} ${d.storage}`);
      await Store.saveCount(S.user, S.store, {kind: 'phones', expected: onHand.length, found: seen.size, missing, extra: [...extra]});
      S.cnt = null; toast(missing.length || extra.length ? `Saved. ${missing.length} missing, ${extra.length} unexpected. A manager has been alerted.` : 'Saved. Every phone accounted for.'); viewCounts(el); };

  }

        ${parts.map(p => { const exp = p.qty[S.store] || 0, c = C[p.id]; const diff = c === undefined || c === '' ? null : +c - exp; return `<tr><td>${esc(p.name)}</td><td class="r num">${exp}</td>
          <td class="r"><input data-pc="${p.id}" inputmode="numeric" value="${c ?? ''}" style="width:80px;min-height:36px;text-align:right" aria-label="Counted ${esc(p.name)}"></td>
          <td class="r num" style="color:${diff ? 'var(--bad)' : 'inherit'}">${diff == null ? '' : diff > 0 ? '+' + diff : diff}</td></tr>`; }).join('')}
        </tbody></table></div>
        ${can(2) ? '<label class="row small" style="gap:8px"><input type="checkbox" id="pc-apply" style="width:auto;min-height:auto"> Set the system counts to what we counted (manager)</label>' : ''}
        <button class="primary" id="pc-save" style="min-height:52px">Finish count</button></div></div>`;
    $('#back').onclick = () => { S.cnt = null; viewCounts(el); };
    el.querySelectorAll('[data-pc]').forEach(i => i.onchange = () => { C[i.dataset.pc] = i.value === '' ? '' : Math.max(0, parseInt(i.value) || 0); const y = window.scrollY; viewCounts(el).then(() => window.scrollTo(0, y)); });
    $('#pc-save').onclick = async () => {
      const items = parts.filter(p => C[p.id] !== undefined && C[p.id] !== '').map(p => ({id: p.id, name: p.name, expected: p.qty[S.store] || 0, counted: +C[p.id]}));
      if (items.length < parts.length) { toast(`${parts.length - items.length} parts not counted yet.`); return; }
      await Store.saveCount(S.user, S.store, {kind: 'parts', items, apply: !!$('#pc-apply')?.checked});
      S.cnt = null; const off = items.filter(i => i.counted !== i.expected).length; toast(off ? `Saved. ${off} parts off. A manager has been alerted.` : 'Saved. Every part matched.'); viewCounts(el); };
    return;
  }
  const inTransit = trs.filter(t => t.status === 'transit' && (t.to === S.store || t.from === S.store));
  el.innerHTML = `<div class="stack">
    <div class="grid g2">
      <div class="panel stack"><h2>Phones · every day</h2>
        <p class="muted small" style="margin:0">The system already knows what should be here: every buy adds a phone, every sale, Swappa sale, Atlas shipment and transfer removes one. You only confirm each phone is physically here.</p>
        <div class="stat"><span class="label">Should be in ${STORES[S.store]}</span><span class="v">${onHand.length}</span><span class="small muted">${onHand.filter(d => d.status === 'repair').length} in repair stock${inTransit.length ? ` · ${inTransit.length} transfer${inTransit.length > 1 ? 's' : ''} in transit (not counted)` : ''}</span></div>
        ${phonesDone ? `<div class="banner ${phonesDone.missing.length || phonesDone.extra.length ? 'bad' : 'ok'} small">Counted today at ${fmtTime(phonesDone.at)} by ${esc(staffName(phonesDone.by))}: ${phonesDone.missing.length ? phonesDone.missing.length + ' missing' : 'all here'}${phonesDone.extra.length ? ', ' + phonesDone.extra.length + ' unexpected' : ''}.</div>` : '<div class="banner warn small">Not counted yet today.</div>'}
        <button class="primary" id="ct-ph">${phonesDone ? 'Count again' : 'Start phone count'}</button></div>
      <div class="panel stack"><h2>Parts · Mon, Wed, Fri</h2>
        <p class="muted small" style="margin:0">Every part used on a ticket or repair stock, every Sentrix delivery and transfer already moves the count. The shelf count catches anything that walked off.</p>
        <div class="stat"><span class="label">Parts tracked</span><span class="v">${parts.length}</span><span class="small muted">${partsCountDay() ? 'Count day' : 'Next count: ' + ['Mon','Mon','Wed','Wed','Fri','Fri','Mon'][new Date().getDay()]}</span></div>
        ${partsDone ? `<div class="banner ${partsDone.items.some(i => i.counted !== i.expected) ? 'bad' : 'ok'} small">Counted today: ${partsDone.items.filter(i => i.counted !== i.expected).length} off.</div>` : partsCountDay() ? '<div class="banner warn small">Count day. Not counted yet.</div>' : ''}
        <button id="ct-pt" class="${partsCountDay() && !partsDone ? 'primary' : ''}">Start parts count</button></div>
    </div>
    <div class="panel stack"><h3>Count history</h3><div class="tbl"><table><thead><tr><th>When</th><th>Store</th><th>What</th><th>Result</th><th>By</th></tr></thead><tbody>

      return `<tr><td class="small">${fmtDate(c.at)} ${fmtTime(c.at)}</td><td>${c.store}</td><td>${c.kind === 'phones' ? 'Phones' : 'Parts'}</td>
      <td class="small">${off ? `<span class="pill bad">${off} off</span> ${esc(c.kind === 'phones' ? [...c.missing, ...c.extra.map(x => 'unexpected #' + x)].join(', ') : c.items.filter(i => i.counted !== i.expected).map(i => `${i.name} ${i.expected}→${i.counted}`).join(', '))}` : '<span class="pill ok">Matched</span>'}</td><td class="small">${esc(staffName(c.by))}</td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No counts yet.</td></tr>'}
    </tbody></table></div></div></div>`;

}

async function viewTransfers(el){
  const [trs, devs, parts] = await Promise.all([Store.transfers(), Store.devices(), Store.parts()]);
  if (S.newTransfer) {
    const T = S.tDraft || (S.tDraft = {to: Object.keys(STORES).find(k => k !== S.store), devices: [], parts: {}, note: ''});
    const avail = devs.filter(d => d.store === S.store && !['sold','atlas'].includes(d.status) && !d.transferId);
    el.innerHTML = `<div class="stack"><div class="crumb"><a id="back">Transfers</a><span class="muted">›</span><b>New transfer from ${STORES[S.store]}</b></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
        <div class="panel stack"><div class="field"><label class="label" for="tr-to">Send to</label><select id="tr-to">${Object.entries(STORES).filter(([k]) => k !== S.store).map(([k, v]) => `<option value="${k}" ${T.to === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
          <span class="label">Devices</span>
          <div class="row"><input id="tr-scan" placeholder="Scan or type stock #" inputmode="numeric" style="max-width:240px" autocomplete="off"><button id="tr-add">Add</button></div>
          <div class="tbl"><table><tbody>${avail.map(d => `<tr class="click" data-td="${d.id}"><td style="width:40px">${T.devices.includes(d.id) ? '<span class="pill ok">✓</span>' : ''}</td><td class="num">${d.stockNo}</td><td>${esc(d.model)} ${esc(d.storage)}</td><td class="small">${STATUS_LABEL[d.status]}</td></tr>`).join('') || '<tr><td class="muted">No devices here.</td></tr>'}</tbody></table></div></div>
        <div class="panel stack"><span class="label">Parts</span>
          <div class="tbl"><table><tbody>${parts.map(p => `<tr><td>${esc(p.name)}<div class="small muted">${p.qty[S.store] || 0} here</div></td><td class="r"><input data-tp="${p.id}" inputmode="numeric" value="${T.parts[p.id] || ''}" placeholder="0" style="width:70px;min-height:36px;text-align:right" aria-label="Send ${esc(p.name)}"></td></tr>`).join('')}</tbody></table></div>
          <div class="field"><label class="label" for="tr-note">Note</label><input id="tr-note" value="${esc(T.note)}" placeholder="Riding with Josh tonight. For ticket #200004"></div>
          <div class="err" id="tr-err" role="alert"></div>
          <button class="primary" id="tr-go" style="min-height:52px">Send ${T.devices.length} devices, ${Object.values(T.parts).reduce((a, x) => a + (+x || 0), 0)} parts</button></div></div></div>`;
    $('#back').onclick = () => { S.newTransfer = false; S.tDraft = null; viewTransfers(el); };
    $('#tr-to').onchange = e => { T.to = e.target.value; };
    $('#tr-note').oninput = e => { T.note = e.target.value; };
    const tog = id => { T.devices.includes(id) ? T.devices.splice(T.devices.indexOf(id), 1) : T.devices.push(id); viewTransfers(el); };
    el.querySelectorAll('[data-td]').forEach(tr => tr.onclick = () => tog(tr.dataset.td));
    const add = () => { const d = avail.find(x => String(x.stockNo) === $('#tr-scan').value.trim()); if (!d) { $('#tr-err').textContent = 'That stock # is not on hand at this store.'; return; } if (!T.devices.includes(d.id)) tog(d.id); };
    $('#tr-add').onclick = add; $('#tr-scan').onkeydown = e => { if (e.key === 'Enter') add(); };
    el.querySelectorAll('[data-tp]').forEach(i => i.onchange = () => { T.parts[i.dataset.tp] = Math.max(0, parseInt(i.value) || 0); const y = window.scrollY; viewTransfers(el).then(() => window.scrollTo(0, y)); });
    $('#tr-go').onclick = async () => { try { const r = await Store.createTransfer(S.user, S.store, {to: T.to, devices: T.devices, parts: Object.entries(T.parts).filter(([, q]) => q > 0).map(([id, qty]) => ({id, qty})), note: T.note});
      S.newTransfer = false; S.tDraft = null; toast(`Transfer T${r.number} sent. ${STORES[r.to]} has been alerted.`); viewTransfers(el); } catch (e) { $('#tr-err').textContent = e.message; } };
    return;
  }
  const mine = trs.filter(t => can(3) || t.to === S.store || t.from === S.store);
  el.innerHTML = `<div class="stack"><div class="row" style="justify-content:space-between"><div><h2>Transfers</h2><p class="muted small" style="margin:0">Parts leave the sending store's count when sent and land in the receiving store's count when it receives them. Devices stay on the sender's books until received.</p></div><button class="primary" id="tr-new">+ New transfer</button></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>From → to</th><th>What</th><th>Sent</th><th>Status</th><th></th></tr></thead><tbody>
    ${mine.map(t => `<tr><td class="num">T${t.number}</td><td>${t.from} → ${t.to}</td><td class="small">${[...t.devices.map(x => esc(x.label)), ...t.parts.map(x => `${esc(x.name)} ×${x.qty}`)].join('<br>')}${t.note ? `<div class="muted">${esc(t.note)}</div>` : ''}</td>
      <td class="small">${fmtDate(t.at)} · ${esc(staffName(t.by))}</td><td>${t.status === 'transit' ? `<span class="pill warn">In transit ${daysOld(t.at)}d</span>` : `<span class="pill ok">Received ${fmtDate(t.receivedAt)}</span>`}</td>
      <td class="r">${t.status === 'transit' && t.to === S.store ? `<button class="primary" data-rcv="${t.id}" style="min-height:34px;padding:4px 10px">Received</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No transfers yet.</td></tr>'}
    </tbody></table></div></div>`;
  $('#tr-new').onclick = () => { S.newTransfer = true; viewTransfers(el); };
  el.querySelectorAll('[data-rcv]').forEach(b => b.onclick = async () => { try { await Store.receiveTransfer(S.user, S.store, b.dataset.rcv); toast('Received. Counts updated.'); viewTransfers(el); } catch (e) { toast(e.message); } });
}

async function viewClock(el){
  const open = await Store.openPunch(S.user.id);
  const ws = weekStart(); const we = new Date(ws); we.setDate(we.getDate() + 7);
  const mine = (await Store.punches(ws, we)).filter(p => p.emp === S.user.id).sort((a, b) => new Date(a.t_in) - new Date(b.t_in));
  const total = mine.reduce((s, p) => s + hrs((p.t_out ? new Date(p.t_out) : new Date()) - new Date(p.t_in)), 0);

/* ---------------- DEVICE INVENTORY ---------------- */
function nextStatusHint(d){
  const age = daysOld(d.createdAt);
  if (d.status === 'testing' && age >= 3) return ['warn', `Testing ${age} days`];
  if (d.status === 'repair' && age >= 7) return ['bad', `Waiting on repair ${age} days`];
  if (d.status === 'tolist' && age >= 3) return ['warn', `Not listed after ${age} days`];
  if (d.status === 'swappa' && age >= 21) return ['warn', `Listed ${age} days`];
  return null;
}

S.sw = {store: 'mine', tab: 'listed', f: 'all'};
async function viewInventory(el){
  const F = S.inv;

  const tabs = '';

  const counts = Object.fromEntries(STATUSES.map(([k]) => [k, all.filter(d => d.status === k && (F.store === 'all' || d.store === (F.store === 'mine' ? S.store : F.store))).length]));

  el.innerHTML = `<div class="stack">${tabs}
    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><h2>Devices</h2><span class="muted small">${rows.length} shown · ${money(atCost)} at cost</span></div>
      <div class="grid g3">

        ${can(3) ? `<div class="field"><label class="label" for="iv-st">Store</label><select id="iv-st"><option value="mine">This store (${S.store})</option><option value="all">All stores</option>${Object.entries(STORES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>` : ''}
        <div class="field"><label class="label" for="iv-s">Status</label><select id="iv-s"><option value="active">Everything not sold</option>${STATUSES.map(([k, l]) => `<option value="${k}">${l} (${counts[k]})</option>`).join('')}<option value="all">All, including sold</option></select></div>

      <td class="num">${d.stockNo ?? '—'}</td><td><b>${esc(d.model)}</b> <span class="muted">${esc(d.storage)} · ${esc(d.carrier)}</span>${d.example ? ' <span class="pill">example</span>' : ''}<div class="mono small muted">${esc(d.imei || '')}</div></td>

      <td><span class="pill ${d.status === 'sold' ? 'ok' : d.status === 'hot' ? 'acc' : ''}">${STATUS_LABEL[d.status]}</span>${d.transferId ? ' <span class="pill warn">In transit</span>' : ''}${h ? ` <span class="pill ${h[0]}">${h[1]}</span>` : ''}</td>
      <td class="r num">${money(d.cost)}</td><td class="r num">${d.soldPrice ? money(d.soldPrice) : '—'}</td>
      <td class="r num" style="color:${profit == null ? 'inherit' : profit >= 0 ? 'var(--ok)' : 'var(--bad)'}">${profit == null ? '—' : money(profit)}</td>
      <td class="num small">${daysOld(d.createdAt)}d</td></tr>`; }).join('') : '<tr><td colspan="8" class="muted">Nothing matches. Devices appear here the moment a buyback is completed.</td></tr>'}

function deviceSheet(d, after){
  sheet(`
    <div class="row" style="justify-content:space-between"><h3>#${d.stockNo ?? ''} ${esc(d.model)} ${esc(d.storage)} · ${esc(d.carrier)}</h3><button data-close>Close</button></div>
    <div class="row"><button type="button" id="d-lbl">Print label</button>${d.buybackId ? '<button type="button" id="d-bos2">Bill of sale</button>' : ''}${d.status === 'repair' ? '<button type="button" id="d-rep2">Open in repair stock</button>' : ''}</div>
    <div class="grid g3 small">
      <div class="stat"><span class="label">Cost</span><span class="num">${money(d.cost)}</span></div>
      <div class="stat"><span class="label">Bought</span><span>${fmtDate(d.createdAt)} · ${d.store}</span></div>
      <div class="stat"><span class="label">Bought by</span><span>${esc(staffName(d.by))}</span></div>
      <div class="stat"><span class="label">IMEI</span><span class="mono">${esc(d.imei || '—')}</span></div>
    </div>
    ${d.notes ? `<p class="small muted">${esc(d.notes)}</p>` : ''}
    <div class="field"><label class="label" for="d-s">Move to</label><select id="d-s">${STATUSES.map(([k, l]) => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field" id="d-list-f"><label class="label" for="d-list">Swappa list price</label><input id="d-list" inputmode="decimal" value="${d.swappa?.price ?? d.listPrice ?? ''}"></div>
    <div class="grid g2" id="d-sold-f">
      <div class="field"><label class="label" for="d-sold">Sold for</label><input id="d-sold" inputmode="decimal" value="${d.soldPrice ?? ''}"></div>
      <div class="field"><label class="label" for="d-ch">Sold through</label><select id="d-ch">${['In store','In store · Acima','Swappa','Atlas','eBay'].map(c => `<option ${d.channel === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label class="label" for="d-n">Notes</label><input id="d-n" value="${esc(d.notes || '')}"></div>
    <div class="err" id="d-err" role="alert"></div>
    <button class="primary" id="d-save">Save</button>`,
    (L, close) => {
      L.querySelector('#d-lbl').onclick = () => labelSheet(d);
      L.querySelector('#d-bos2') && (L.querySelector('#d-bos2').onclick = () => bosSheet(d.buybackId, d.id));
      L.querySelector('#d-rep2') && (L.querySelector('#d-rep2').onclick = () => { close(); go('repair', {deviceId: d.id}); });
      const sync = () => { const s = L.querySelector('#d-s').value; L.querySelector('#d-list-f').hidden = s !== 'swappa'; L.querySelector('#d-sold-f').hidden = !['sold','atlas'].includes(s); };
      L.querySelector('#d-s').onchange = sync; sync();
      L.querySelector('#d-save').onclick = async () => {
        const status = L.querySelector('#d-s').value; const patch = {status, notes: L.querySelector('#d-n').value.trim()};
        if (status === 'swappa' && d.status !== 'swappa') { const p = parseFloat(L.querySelector('#d-list').value); if (!(p > 0)) { L.querySelector('#d-err').textContent = 'Enter the Swappa list price.'; return; }
          await Store.swappaList(S.user, S.store, d.id, p); close(); toast('Listed on Swappa'); return after(); }
        if (status === 'sold' && L.querySelector('#d-ch').value === 'Swappa') { await Store.swappaSold(S.user, S.store, d.id, parseFloat(L.querySelector('#d-sold').value) || 0, ''); close(); toast(`${STORES[d.store]} alerted to pull and pack it`); return after(); }
        if (status === 'sold' || status === 'atlas') {
          const v = parseFloat(L.querySelector('#d-sold').value);
          if (status === 'sold' && !(v > 0)) { L.querySelector('#d-err').textContent = 'Enter what it sold for so profit is tracked.'; return; }
          if (v > 0) { patch.soldPrice = v; patch.channel = L.querySelector('#d-ch').value; if (status === 'atlas') patch.channel = 'Atlas'; }
        }
        await Store.updateDevice(S.user, S.store, d.id, patch);
        close(); toast('Saved'); after();
      };
    });
}

function suggestOrder(store, parts, reqs, pos){
  const onOrder = id => pos.filter(p => p.store === store && p.status !== 'received').reduce((a, p) => a + p.lines.filter(l => l.partId === id).reduce((x, l) => x + l.qty - l.received, 0), 0);
  const lines = parts.filter(p => p.dq > 0).map(p => ({name: p.name, partId: p.id, qty: Math.max(0, p.dq - (p.qty[store] || 0) - onOrder(p.id)), why: `DQ ${p.dq} · have ${p.qty[store] || 0}${onOrder(p.id) ? ' · on order ' + onOrder(p.id) : ''}`, requestIds: []})).filter(l => l.qty > 0);
  reqs.filter(r => r.store === store && r.status === 'needed' && !r.poId).forEach(r => {
    const same = r.partId && lines.find(l => l.partId === r.partId);
    if (same) { same.qty += r.qty; same.requestIds.push(r.id); same.why += ` · +${r.qty} for ${r.forLabel || 'request'}`; }
    else lines.push({name: r.name, partId: r.partId, qty: r.qty, why: (r.rush ? 'RUSH special order: ' : 'Special order: ') + (r.forLabel || 'shelf stock') + (r.cost ? ` · Sentrix ${cents(r.cost)}` : ''), requestIds: [r.id], productId: r.productId || '', url: r.url || '', quality: r.quality || ''});
  });
  return lines;
}

/* Repair prices: read the published tabs of REPAIR PRICES - CZ (same as the rep quote page). Falls back to the saved copy. */
const RQ_PUB = 'https://docs.google.com/spreadsheets/d/1_LCeGk23y5aZ_mT3Oej_6f1b9Zh9PhYuK8R5LlxaNkA/pub';
const RQ_TABS = {Apple: 510910333, Samsung: 1436859400, Pixel: 1436859500, Moto: 746224264, Consoles: 1693651162, PC: 1691333639, Mac: 784629370, 'Surface Pro': 1750962834};
function rqCSV(t){ const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++){ const c = t[i];
    if (q){ if (c === '"'){ if (t[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\r') f += c; }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => { let k = r.length; while (k > 0 && r[k - 1] === '') k--; return r.slice(0, k); }); }
const rqN = h => String(h || '').replace(/\s+/g, ' ').trim();
const rqC = v => { v = rqN(v); return ['', '—', '-', '–', 'x'].includes(v) ? null : v; };
function rqSections(vals){
  const out = [], notes = []; let i = 0; const isH = r => r && rqN(r[0]) === 'Model';
  while (i < vals.length){ const r = vals[i];
    if (i + 1 < vals.length && isH(vals[i + 1])){
      const title = rqN(r && r[0]), hdr = vals[i + 1].map(rqN), rows = []; let j = i + 2;
      while (j < vals.length && vals[j] && rqN(vals[j][0]) && !(j + 1 < vals.length && isH(vals[j + 1]))){ rows.push(vals[j]); j++; }
      (r || []).slice(1).map(rqN).filter(x => x && /\d/.test(x)).forEach(x => notes.push(x));
      out.push([title, hdr, rows]); i = j;
    } else { if (r && rqN(r[0]) && !(i + 1 < vals.length && isH(vals[i + 1]))){ const t = r.map(rqN).filter(Boolean).join(' · '); if (t) notes.push(t); } i++; } }
  return [out, notes]; }
function rqBuild(V){
  const cats = {}; const cat = (k, n) => cats[k] || (cats[k] = {name: n, cols: null, models: [], notes: []});
  const add = (c, g, hdr, rows) => { const keep = []; for (let k = 1; k < hdr.length; k++) if (hdr[k]) keep.push(k);
    if (!c.cols) c.cols = keep.map(k => hdr[k]);
    for (const r0 of rows){ const r = r0.concat(Array(Math.max(0, hdr.length - r0.length)).fill('')); const p = keep.map(k => rqC(r[k])); if (p.some(Boolean)) c.models.push({n: rqN(r[0]), g, p}); } };
  let [secs, notes] = rqSections(V.Apple);
  const amap = {'APPLE iPHONE': ['iphone', 'iPhone'], 'APPLE iPAD': ['ipad', 'iPad'], 'APPLE WATCH': ['watch', 'Apple Watch'], 'APPLE iPOD': ['ipod', 'iPod']};
  for (const [t, h, rows] of secs){ const m = amap[t]; if (m) add(cat(m[0], m[1]), '', h, rows); }
  for (const k of ['iphone', 'ipad', 'watch', 'ipod']) if (cats[k]) cats[k].notes = notes.filter(x => /labor/i.test(x));
  for (const [tab, key, name] of [['Samsung', 'samsung', 'Samsung'], ['Pixel', 'pixel', 'Pixel']]){
    [secs, notes] = rqSections(V[tab]); const c = cat(key, name);
    for (const [t, h, rows] of secs){ const g = t.replace(/^SAMSUNG\s+/, '').toLowerCase().replace(/\b\w/g, x => x.toUpperCase()).replace('(Outer Screen)', '(outer screen)'); add(c, g, h, rows); }
    c.notes = notes.filter(x => !x.startsWith('Cellular Zone')); }
  for (const [tab, key, name] of [['Moto', 'moto', 'Motorola'], ['Consoles', 'console', 'Game Console'], ['Surface Pro', 'surface', 'Surface']]){
    [secs, notes] = rqSections(V[tab]); const c = cat(key, name);
    for (const [, h, rows] of secs) add(c, '', h, rows);
    c.notes = notes.filter(x => !/^Cellular ?Zone/.test(x) && !['Consoles', 'Microsoft'].includes(x)); }
  const c = cat('computer', 'Computer'); c.cols = ['Price'];
  for (const tab of ['PC', 'Mac']){ let started = false;
    for (const r of V[tab]){ if (!r || !rqN(r[0])) continue; const a = rqN(r[0]);
      if (['Computers', 'Mac', 'Model'].includes(a) || a.startsWith('Cellular Zone')){ started = true; continue; }
      if (/labor/i.test(a) || a.startsWith('Any repair')){ if (!c.notes.includes(a)) c.notes.push(a); continue; }
      const price = r.slice(1).map(rqN).filter(Boolean).join(' · ');
      if (started && price) c.models.push({n: a, g: tab === 'PC' ? 'PC' : 'Mac', p: [price]}); } }
  for (const x of Object.values(cats)){ const nn = [];
    for (let t of x.notes){ t = t.replace(/^Prices pull automatically[^.]*\.\s*/, '').replace(/\s*-+$/, '').trim();
      if (!t || t.startsWith('—') || nn.includes(t) || t.includes('Smartphone Labor: $60')) continue; nn.push(t); }
    x.notes = nn; }
  const o = {}; for (const k of ['iphone', 'samsung', 'pixel', 'ipad', 'watch', 'moto', 'console', 'computer', 'surface', 'ipod']) if (cats[k]) o[k] = cats[k];
  return o; }
async function loadRepairPrices(){
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6000); const V = {};
    await Promise.all(Object.entries(RQ_TABS).map(async ([name, gid]) => { const r = await fetch(`${RQ_PUB}?gid=${gid}&single=true&output=csv`, {cache: 'no-store', signal: ctl.signal}); if (!r.ok) throw new Error(name); V[name] = rqCSV(await r.text()); }));
    clearTimeout(to); const cats = rqBuild(V);
    if (cats.iphone && cats.iphone.models.length >= 30) return {cats, live: true, asof: 'loaded ' + new Date().toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})};
  } catch {}
  try { const r = await fetch('repair-prices.json', {cache: 'no-store'}); if (r.ok){ const d = await r.json(); if (d.cats) return {cats: d.cats, live: false, asof: d.asof}; } } catch {}
  return {cats: {iphone: {name: 'iPhone', cols: [], models: [], notes: ['Repair prices could not be loaded. Reload the page.']}}, live: false, asof: 'unavailable'};
}
const rqDevice = (k, m) => k === 'watch' ? 'Apple Watch ' + m.n : k === 'computer' ? (m.g === 'Mac' ? 'Mac' : 'PC') : k === 'pixel' && !/pixel/i.test(m.n) ? 'Pixel ' + m.n : k === 'samsung' && !/galaxy|note/i.test(m.n) ? 'Galaxy ' + m.n : m.n;
const rqIssue = (k, m) => ({iphone: 'iPhone Repair', samsung: 'Smartphone Repair', pixel: 'Smartphone Repair', moto: 'Smartphone Repair', watch: 'Smartphone Repair', ipod: 'Smartphone Repair', ipad: 'iPad Repair', surface: 'Tablet Repair', console: 'Game Console Repair'})[k] || (m.g === 'Mac' ? 'Macbook Repair' : 'Computer Repair');
const rqRepairName = (k, m, col) => k === 'computer' ? m.n : /glass only/i.test(col) && /^(GOOD|BETTER|BEST)\s/.test(col) ? 'Glass Only (' + col.split(' ')[0].toLowerCase() + ')' : col.replace(/^(GOOD|BETTER|BEST)\s+/, '');
const rqMatch = (x, q) => { const hay = (rqDevice(x.k, x.m) + ' ' + x.m.g + ' ' + x.c.name + ' ' + x.m.n + (x.m.g === 'Mac' ? ' macbook imac' : x.m.g === 'PC' ? ' laptop windows' : '')).toLowerCase().replace(/playstation\s*/g, 'ps').replace(/series\s*/g, 'series ');
  const qq = q.replace(/playstation\s*/g, 'ps').replace(/\bxbox\s+/, 'xbox ').replace(/\bs(\d{2})\b/, 'galaxy s$1');
  return qq.split(' ').every(w => hay.includes(w)) || q.split(' ').every(w => hay.includes(w)); };
function rqDeviceNames(){ const out = new Set(); for (const [k, c] of Object.entries(S.rq.cats)) for (const m of c.models) out.add(rqDevice(k, m)); return [...out]; }

    <div class="tbl"><table><thead><tr><th>Employee</th>${days.map(d => `<th class="r">${d.toLocaleDateString('en-US',{weekday:'short',day:'numeric'})}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
    ${grid.map(g => `<tr class="click" data-e="${g.e.id}" tabindex="0"><td><b>${esc(g.e.name)}</b> <span class="muted small">${ROLES[g.e.role]}</span></td>${g.per.map(v => `<td class="r num">${v ? fmtH(v) : '<span class="muted">—</span>'}</td>`).join('')}<td class="r num"><b>${fmtH(g.tot)}</b>${g.tot > 40 ? ' <span class="pill warn">OT</span>' : ''}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="muted small">Tap a person to see and fix individual punches. Every fix is logged with the manager's name.</p>
    <textarea id="w-csv" rows="3" readonly aria-label="Timesheet CSV" hidden>${esc(csv)}</textarea></div>`;
  $('#w-prev').onclick = () => { S.week = new Date(ws.getTime() - 7*86400000); viewHours(el); };
  $('#w-next').onclick = () => { S.week = new Date(ws.getTime() + 7*86400000); viewHours(el); };
  $('#w-copy').onclick = async () => { try { await navigator.clipboard.writeText(csv); toast('Copied. Paste into an email or spreadsheet.'); } catch { const t = $('#w-csv'); t.hidden = false; t.select(); toast('Select-all is ready. Press Ctrl+C to copy.'); } };
  $('#w-dl').onclick = async () => {
    const filename = `CZ hours week of ${dayKey(ws)}.csv`;
    const dl = window.claude?.use ? await window.claude.use('downloads').catch(() => null) : null;

    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded ' + filename); }
    catch { toast('Download failed. Use Copy for accountant instead.'); }
  };
  el.querySelectorAll('tr[data-e]').forEach(tr => tr.onclick = () => {
    const g = grid.find(x => x.e.id === tr.dataset.e);
    const toLocal = iso => { if (!iso) return ''; const d = new Date(iso); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0, 16); };
    sheet(`<div class="row" style="justify-content:space-between"><h3>${esc(g.e.name)} · punches</h3><button data-close>Close</button></div>
      ${g.mine.length ? g.mine.sort((a, b) => new Date(a.t_in) - new Date(b.t_in)).map(p => `<div class="grid g2" data-p="${p.id}" style="align-items:end">

      <div class="err" id="pu-e" role="alert"></div>
      ${g.mine.length ? '<button class="primary" id="pu-s">Save changes</button>' : ''}`,
      (L, close) => { const s = L.querySelector('#pu-s'); if (s) s.onclick = async () => {
        for (const p of g.mine) {

        }
        close(); toast('Hours updated'); viewHours(el);
      }; });
  });
}

/* ---------------- STAFF ---------------- */
/* ---------------- REPAIRSHOPR IMPORT (owner) ----------------
   Runs in this browser tab: reads RepairShopr's API with a read-only key the owner pastes (kept in memory only, never saved),
   and writes each page into the POS database through pos_import (owner PIN). Resumable; safe to run again (rows match on RepairShopr id). */
const RS_API = 'https://cellularzone.repairshopr.com/api/v1/';
const RS_ST = {'new': 'new', 'in progress': 'progress', 'awaiting approval': 'approval', 'awaiting device': 'device', 'scheduled': 'scheduled', 'waiting for parts': 'parts',
  'waiting on customer': 'customer', 'customer reply': 'reply', 'board level': 'board', 'resolved': 'resolved'};
const rsStore = n => /bulverde/i.test(n || '') ? 'BV' : /potranco/i.test(n || '') ? 'PT' : /babcock|zavala|dz/i.test(n || '') ? 'DZ' : null;
const RSI = {log: [], running: false, stop: false, loc: {1163: 'BV', 1931: 'PT', 1164: 'DZ'}, tally: {}, unknownSt: {}, unknownLoc: {}};   /* RepairShopr location ids (Admin → Locations) */
function rsiState(){ try { return JSON.parse(localStorage.getItem('czpos-rsimport') || '{}'); } catch { return {}; } }
function rsiSave(st){ try { localStorage.setItem('czpos-rsimport', JSON.stringify(st)); } catch {} }
async function rsGet(tok, path, params = {}){
  const u = new URL(RS_API + path); Object.entries(params).forEach(([k, v]) => v != null && u.searchParams.set(k, v));
  for (let tries = 0; ; tries++){
    let r; try { r = await fetch(u, {headers: {Authorization: 'Bearer ' + tok, Accept: 'application/json'}}); } catch (e) { if (tries < 5) { await new Promise(z => setTimeout(z, 5000)); continue; } throw e; }
    if (r.status === 429 || r.status >= 500) { if (tries < 8) { await new Promise(z => setTimeout(z, 15000)); continue; } }
    if (r.status === 401) throw new Error('RepairShopr rejected the API key (401). Check it was pasted in full.');
    if (r.status === 403) throw Object.assign(new Error(`The API key isn't allowed to read ${path.split('/')[0]} (403). Add that permission to the key in RepairShopr.`), {code: 403});
    if (!r.ok) throw new Error(`RepairShopr ${path} → ${r.status}`);
    await new Promise(z => setTimeout(z, 340));   /* stay under ~180 requests a minute */
    return r.json();
  }
}
const phone10 = (...a) => { for (const x of a) { const d = String(x || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, ''); if (d.length === 10) return d; } return ''; };
function rsCust(c){ const store = RSI.loc[c.location_id] || rsStore(c.location_name) || null;
  return {rs_id: c.id, name: (c.fullname || [c.firstname, c.lastname].filter(Boolean).join(' ') || c.business_name || '').trim(), phone: phone10(c.mobile, c.phone), email: c.email || '',
    store, address: [c.address, c.address_2, c.city, c.state, c.zip].filter(Boolean).join(', '), notes: c.notes || '', business: c.business_name || '', created_at: c.created_at}; }
function rsTicket(t){
  const label = String(t.status || '').trim(); let status = RS_ST[label.toLowerCase()]; if (!status) { RSI.unknownSt[label] = (RSI.unknownSt[label] || 0) + 1; status = 'progress'; }
  let store = RSI.loc[t.location_id] || rsStore(t.location_name);
  if (!store) { RSI.unknownLoc[t.location_id || 'none'] = (RSI.unknownLoc[t.location_id || 'none'] || 0) + 1; store = 'DZ'; }
  const props = t.properties || {}; const pk = re => { const k = Object.keys(props).find(k => re.test(k)); return k ? String(props[k] ?? '').trim() : ''; };
  const comments = Array.isArray(t.comments) ? t.comments.map(c => ({id: 'rs' + c.id, at: c.created_at, by: c.tech || '', text: ((c.subject && !/^(update|initial issue)$/i.test(c.subject) ? c.subject + ': ' : '') + String(c.body || '')).slice(0, 3000), pub: !c.hidden, sys: false}))
    .sort((a, b) => new Date(b.at) - new Date(a.at)) : null;
  RSI.tally[t.id] = status === 'resolved' ? null : store + '|' + label;
  return {rs_id: t.id, number: parseInt(t.number, 10) || null, customer_rs_id: t.customer_id, store, device: pk(/model|device/i), imei: pk(/imei|serial/i), passcode: pk(/pass/i),
    issue: t.problem_type || '', subject: t.subject || '', status, rs_status: label, priority: Math.min(3, Math.max(0, parseInt(t.priority, 10) || 2)),
    rs_tech: t.user?.full_name || t.user?.name || '', comments: comments || [], created_at: t.created_at, updated_at: t.updated_at, resolved_at: t.resolved_at, _needDetail: !comments && status !== 'resolved'}; }
function rsInvoice(i){ return {rs_id: i.id, number: parseInt(i.number, 10) || null, at: i.date || i.created_at, store: RSI.loc[i.location_id] || rsStore(i.location_name) || 'DZ', ticket_rs_id: i.ticket_id, customer_rs_id: i.customer_id,
  lines: (i.line_items || []).map(l => ({desc: l.name || l.item || '', price: +l.price || 0, qty: +l.quantity || 1, cat: 'RepairShopr'})), payment: '', subtotal: +i.subtotal || 0, tax: +i.tax || 0, total: +i.total || 0, paid: !!i.is_paid}; }
function rsProduct(p){ const qty = {DZ: 0, BV: 0, PT: 0}; (p.location_quantities || []).forEach(l => { const st = RSI.loc[l.location_id]; if (st) qty[st] += +l.quantity || 0; else if (+l.quantity) RSI.unknownLoc['old location ' + l.location_id + ' (stock)'] = (RSI.unknownLoc['old location ' + l.location_id + ' (stock)'] || 0) + 1; });
  if (!(p.location_quantities || []).length && p.quantity) qty.DZ += +p.quantity;
  return {rs_id: p.id, name: p.name, description: p.description || '', category: p.product_category || p.category_path || '', upc: p.upc_code || '', price: +p.price_retail || 0, cost: +p.price_cost || 0, qty, maintain_stock: !!p.maintain_stock, disabled: !!p.disabled}; }

async function rsImportRun(tok, mode, ui){
  const st = rsiState(); RSI.running = true; RSI.stop = false; const say = m => { RSI.log.unshift(new Date().toLocaleTimeString() + ' · ' + m); RSI.log = RSI.log.slice(0, 60); ui(); };
  if (st.loc) Object.assign(RSI.loc, st.loc);
  const startedAt = new Date().toISOString();
  const pages = async (kind, path, key, map, params = {}) => {
    let page = mode === 'full' ? (st[kind + 'Page'] || 1) : 1; let total = null;
    while (!RSI.stop){
      const j = await rsGet(tok, path, {...params, page}); const list = j[key] || []; total = j.meta?.total_pages || total;
      if (!list.length) break;
      const rows = list.map(map); const clean = rows.map(({_needDetail, ...r}) => r);
      if (kind === 'tickets') { const need = [...new Set(clean.map(r => r.customer_rs_id).filter(Boolean))]; RSI.needCust = need; }
      await Store.importRows(S.user, kind, clean);
      if (kind === 'tickets') rows.filter(r => r._needDetail).forEach(r => RSI.detail.add(r.rs_id));
      st[kind + 'Page'] = page + 1; st.loc = RSI.loc; if (mode === 'full') rsiSave(st);
      say(`${kind}: page ${page}${total ? ' of ' + total : ''} (${list.length})`);
      if (total && page >= total) break; page++;
    }
    if (!RSI.stop && mode === 'full') { st[kind + 'Done'] = true; rsiSave(st); }
  };
  RSI.detail = new Set();
  try {
    if (mode === 'full'){
      if (!st.customersDone) await pages('customers', 'customers', 'customers', rsCust);
      if (!RSI.stop && !st.ticketsDone) await pages('tickets', 'tickets', 'tickets', rsTicket);
      if (!RSI.stop && !st.invoicesDone) await pages('invoices', 'invoices', 'invoices', rsInvoice);
      if (!RSI.stop && !st.productsDone) { try { await pages('products', 'products', 'products', rsProduct); } catch (e) { if (e.code === 403) say('Products skipped: ' + e.message); else throw e; } }
    } else {
      const since = st.lastSync || st.fullStartedAt; if (!since) throw new Error('Run the full import first.');
      /* catch-up: tickets and invoices changed since the last run, plus any customer they point to */
      for (const [kind, map] of [['tickets', rsTicket], ['invoices', rsInvoice]]) {
        let page = 1;
        while (!RSI.stop){ const j = await rsGet(tok, kind, {since_updated_at: since, page}); const list = j[kind] || []; if (!list.length) break;
          const custIds = [...new Set(list.map(x => x.customer_id).filter(Boolean))];
          const custs = []; for (const id of custIds) { try { const c = await rsGet(tok, 'customers/' + id); if (c.customer) custs.push(rsCust(c.customer)); } catch {} }
          if (custs.length) await Store.importRows(S.user, 'customers', custs);
          const rows = list.map(map); await Store.importRows(S.user, kind, rows.map(({_needDetail, ...r}) => r)); if (kind === 'tickets') rows.filter(r => r._needDetail).forEach(r => RSI.detail.add(r.rs_id));
          say(`catch-up ${kind}: page ${page} (${list.length})`); if (j.meta?.total_pages && page >= j.meta.total_pages) break; page++; }
      }
      try { let page = 1; while (!RSI.stop) { const j = await rsGet(tok, 'products', {page}); if (!(j.products || []).length) break; await Store.importRows(S.user, 'products', j.products.map(rsProduct)); say(`products: page ${page}`); if (j.meta?.total_pages && page >= j.meta.total_pages) break; page++; } } catch (e) { if (e.code === 403) say('Products skipped: ' + e.message); else throw e; }
    }
    /* open tickets whose list entry had no notes: pull each one for its notes */
    if (!RSI.stop && RSI.detail.size) { let n = 0; for (const id of RSI.detail) { if (RSI.stop) break; const j = await rsGet(tok, 'tickets/' + id); if (j.ticket) { const {_needDetail, ...r} = rsTicket(j.ticket); await Store.importRows(S.user, 'tickets', [r]); } if (++n % 10 === 0) say(`notes for open tickets: ${n} of ${RSI.detail.size}`); } }
    if (!RSI.stop) { if (mode === 'full' && !st.fullStartedAt) st.fullStartedAt = startedAt; st.lastSync = startedAt; rsiSave(st); say(RSI.stop ? 'Paused.' : 'Done.'); }
  } catch (e) { say('Stopped: ' + e.message); }
  RSI.running = false; ui();
}
function rsImportPanel(box){
  const st = rsiState(); let sum = null;
  const draw = () => { const done = k => st[k + 'Done'] ? '✓' : st[k + 'Page'] ? `page ${st[k + 'Page'] - 1}` : '—';
    box.innerHTML = `<div class="panel stack"><h2>Import from RepairShopr</h2>
      <p class="small muted" style="margin:0">Copies every customer, every ticket (all years, with notes), every invoice and the product inventory from RepairShopr into the POS. It only reads RepairShopr; nothing there changes. Keep this tab open while it runs (about 45–60 minutes the first time). If it stops, press Start again and it picks up where it left off. Running it again never makes duplicates.</p>
      <div class="field"><label class="label" for="rsi-k">RepairShopr API key (read-only; used in this tab only, never saved)</label><input id="rsi-k" type="password" autocomplete="off" placeholder="Paste the key from RepairShopr → Admin → API Tokens"></div>
      <div class="row"><button class="primary" id="rsi-full" ${RSI.running ? 'disabled' : ''}>${st.ticketsPage && !st.lastSync ? 'Continue full import' : 'Start full import'}</button><button id="rsi-catch" ${RSI.running || !st.lastSync ? 'disabled' : ''}>Catch up (changes since ${st.lastSync ? fmtDate(st.lastSync) + ' ' + fmtTime(st.lastSync) : 'last run'})</button>${RSI.running ? '<button id="rsi-stop">Pause</button>' : ''}<button id="rsi-sum">Check counts</button></div>
      <div class="small">Customers ${done('customers')} · Tickets ${done('tickets')} · Invoices ${done('invoices')} · Products ${done('products')}</div>
      ${Object.keys(RSI.unknownSt).length ? `<div class="banner warn small">Statuses not in the POS list (shown as In Progress until mapped): ${Object.entries(RSI.unknownSt).map(([k, v]) => esc(k) + ' (' + v + ')').join(', ')}</div>` : ''}
      ${Object.keys(RSI.unknownLoc).length ? `<div class="banner warn small">Locations not matched to a store (filed under Babcock): ${Object.entries(RSI.unknownLoc).map(([k, v]) => esc(k) + ' (' + v + ')').join(', ')}</div>` : ''}
      ${sum ? `<div class="tbl"><table><thead><tr><th>In the POS now</th><th class="r">Count</th></tr></thead><tbody>${['customers', 'tickets', 'invoices', 'products'].map(k => `<tr><td>${k}</td><td class="r num">${sum[k]}</td></tr>`).join('')}</tbody></table></div>
        <div class="tbl"><table><thead><tr><th>Open tickets by status</th>${Object.keys(STORES).map(k => `<th class="r">${STORES[k]}</th>`).join('')}</tr></thead><tbody>
        ${[...new Set(Object.values(sum.open || {}).flatMap(o => Object.keys(o)))].sort().map(lbl => `<tr><td>${esc(lbl)}</td>${Object.keys(STORES).map(k => `<td class="r num">${sum.open?.[k]?.[lbl] || 0}</td>`).join('')}</tr>`).join('')}
        <tr><td><b>All open</b></td>${Object.keys(STORES).map(k => `<td class="r num"><b>${Object.values(sum.open?.[k] || {}).reduce((a, b) => a + b, 0)}</b></td>`).join('')}</tr></tbody></table></div>` : ''}
      <div class="small mono" style="max-height:220px;overflow:auto;background:var(--soft);border-radius:8px;padding:8px">${RSI.log.map(esc).join('<br>') || 'Not started.'}</div></div>`;
    const key = () => { const k = box.querySelector('#rsi-k').value.trim(); if (!k) { toast('Paste the RepairShopr API key first.'); return null; } RSI.key = k; return k; };
    if (RSI.key) box.querySelector('#rsi-k').value = RSI.key;
    box.querySelector('#rsi-full').onclick = () => { const k = key(); if (k) rsImportRun(k, 'full', () => { Object.assign(st, rsiState()); draw(); }); };
    box.querySelector('#rsi-catch').onclick = () => { const k = key(); if (k) rsImportRun(k, 'catch', () => { Object.assign(st, rsiState()); draw(); }); };
    box.querySelector('#rsi-stop') && (box.querySelector('#rsi-stop').onclick = () => { RSI.stop = true; toast('Pausing after this page…'); });
    box.querySelector('#rsi-sum').onclick = async () => { try { sum = await Store.importSummary(S.user); draw(); } catch (e) { toast(e.message); } };
  };
  draw();
}

async function viewStaff(el){
  S.staff = await Store.employees();
  const set = await Store.settings();
  el.innerHTML = `<div class="stack">${Store.mode !== 'demo' && can(3) ? '<div id="rsi-box"></div>' : ''}
    <div class="panel stack"><h2>Settings</h2>
      <div class="grid g2">
        <div class="field"><label class="label" for="st-link">Google review link</label><input id="st-link" value="${esc(set.reviewLink)}"></div>
        <div class="field"><label class="label" for="st-delay">Send review text this many hours after a ticket closes</label><input id="st-delay" inputmode="numeric" value="${set.reviewDelayH}"></div></div>
      <div class="field"><label class="label" for="st-msg">Review text ({first}, {store}, {device}, {link} fill in)</label><textarea id="st-msg" rows="2">${esc(set.reviewMsg)}</textarea></div>
      <div class="field"><label class="label" for="st-up">Upsell reminders, one per line (shown at check-in, checkout and the register)</label><textarea id="st-up" rows="3">${esc(set.upsells.join('\n'))}</textarea></div>
      <div class="field"><label class="label" for="st-acc">Register buttons, one per line: name | price | category</label><textarea id="st-acc" rows="4">${esc(set.accessories.map(a => a.join(' | ')).join('\n'))}</textarea></div>
      <div class="grid g3">
        <div class="field"><label class="label" for="st-lp">Labor: phones</label><input id="st-lp" inputmode="decimal" value="${set.labor.phone}"></div>
        <div class="field"><label class="label" for="st-lt">Labor: tablets</label><input id="st-lt" inputmode="decimal" value="${set.labor.tablet}"></div>
        <div class="field"><label class="label" for="st-lc">Labor: consoles</label><input id="st-lc" inputmode="decimal" value="${set.labor.console}"></div>
        <div class="field"><label class="label" for="st-lk">Labor: computers</label><input id="st-lk" inputmode="decimal" value="${set.labor.computer}"></div>
        <div class="field"><label class="label" for="st-oem">Genuine OEM: add to part cost</label><input id="st-oem" inputmode="decimal" value="${set.oemAdd}"></div>
        <div class="field"><label class="label" for="st-fl">Starting cash in each drawer</label><input id="st-fl" inputmode="decimal" value="${set.float}"></div></div>
      <div class="err" id="st-e" role="alert"></div><button class="primary" id="st-save" style="align-self:flex-start">Save settings</button>
    </div>
    <div class="panel row" style="justify-content:space-between"><div><h2>Staff</h2><p class="muted small" style="margin:0">Reps and techs can clock in, buy at or under max, move devices and count parts. Managers also approve over-max buys, fix hours and see the dashboard. Only the owner manages staff.</p></div><button class="primary" id="s-add">Add employee</button></div>
    <div class="tbl"><table><thead><tr><th>Name</th><th>Role</th><th>Home store</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.staff.map(e => `<tr><td><b>${esc(e.name)}</b></td><td>${ROLES[e.role]}</td><td>${STORES[e.store] || '—'}</td><td>${e.active ? '<span class="pill ok">Active</span>' : '<span class="pill">Inactive</span>'}</td><td><button data-e="${e.id}">Edit</button></td></tr>`).join('')}
    </tbody></table></div>
    ${Store.mode === 'demo' ? '<div class="row"><button class="danger" id="s-reset">Reset demo data</button><span class="muted small">Wipes this browser\'s demo and reloads the examples.</span></div>' : ''}</div>`;
  const edit = e => sheet(`<div class="row" style="justify-content:space-between"><h3>${e ? 'Edit ' + esc(e.name) : 'Add employee'}</h3><button data-close>Close</button></div>
    <div class="field"><label class="label" for="e-n">Name</label><input id="e-n" value="${esc(e?.name || '')}" autocomplete="off"></div>
    <div class="grid g2">
      <div class="field"><label class="label" for="e-r">Role</label><select id="e-r">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${e?.role === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label class="label" for="e-s">Home store</label><select id="e-s">${Object.entries(STORES).map(([k, v]) => `<option value="${k}" ${e?.store === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label class="label" for="e-p">${e ? 'New PIN (leave blank to keep)' : '4-digit PIN'}</label><input id="e-p" inputmode="numeric" maxlength="4" autocomplete="off"></div>
      <div class="field"><label class="label" for="e-a">Status</label><select id="e-a"><option value="1" ${e?.active !== false ? 'selected' : ''}>Active</option><option value="0" ${e?.active === false ? 'selected' : ''}>Inactive (can't log in)</option></select></div>
    </div>
    <div class="err" id="e-err" role="alert"></div><button class="primary" id="e-save">Save</button>`,
    (L, close) => L.querySelector('#e-save').onclick = async () => {
      const name = L.querySelector('#e-n').value.trim(), pin = L.querySelector('#e-p').value.trim();
      const err = !name ? 'Enter a name.' : (pin && !/^\d{4}$/.test(pin)) ? 'PIN must be exactly 4 digits.' : (!e && !pin) ? 'Give the new employee a 4-digit PIN.' : '';
      if (err) { L.querySelector('#e-err').textContent = err; return; }
      try { await Store.saveEmployee(S.user, {id: e?.id, name, role: L.querySelector('#e-r').value, store: L.querySelector('#e-s').value, active: L.querySelector('#e-a').value === '1', pin: pin || null}); close(); toast('Saved'); viewStaff(el); }
      catch (x) { L.querySelector('#e-err').textContent = x.message; }
    });
  $('#rsi-box') && rsImportPanel($('#rsi-box'));
  $('#s-add').onclick = () => edit(null);
  $('#st-save').onclick = async () => {
    const acc = $('#st-acc').value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a[0]);
    if (acc.some(a => !(parseFloat(a[1]) > 0))) { $('#st-e').textContent = 'Each register line needs a price, like: Case | 5 | Accessory'; return; }
    try { await Store.saveSettings(S.user, {reviewLink: $('#st-link').value.trim(), reviewDelayH: Math.max(1, parseInt($('#st-delay').value) || 24), reviewMsg: $('#st-msg').value.trim(),
      upsells: $('#st-up').value.split('\n').map(x => x.trim()).filter(Boolean), accessories: acc.map(a => [a[0], parseFloat(a[1]), LINE_CATS.includes(a[2]) ? a[2] : 'Accessory']),
      labor: {phone: +$('#st-lp').value || 0, tablet: +$('#st-lt').value || 0, console: +$('#st-lc').value || 0, computer: +$('#st-lk').value || 0}, oemAdd: +$('#st-oem').value || 0, float: +$('#st-fl').value || 0});
      toast('Settings saved'); } catch (e) { $('#st-e').textContent = e.message; } };
  el.querySelectorAll('[data-e]').forEach(b => b.onclick = () => edit(S.staff.find(e => e.id === b.dataset.e)));
  $('#s-reset') && ($('#s-reset').onclick = async () => { await DemoStore.reset(); S.staff = await Store.employees(); toast('Demo data reset'); renderLock(); });
}

boot();
</script>
